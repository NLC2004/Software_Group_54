<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - BUPT International School TA Recruitment System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<style>
        body {
            background: linear-gradient(135deg, #EBF4FF 0%, #F5F7FA 100%);
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .login-card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .tab-btn.active { color: #2563EB; border-bottom: 2px solid #2563EB; }
        .tab-btn { color: #9CA3AF; border-bottom: 2px solid transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center py-12 px-4">
<div class="w-full max-w-md">
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center p-3 bg-blue-600 rounded-2xl shadow-lg mb-6">
<span class="iconify text-white text-4xl" data-icon="mdi:school"></span>
</div>
<h1 class="text-2xl font-bold text-gray-800 tracking-tight">
                BUPT International School<br/>
<span class="text-blue-600">TA Recruitment System</span>
</h1>
<p class="text-blue-600 mt-2 text-xl font-semibold">TA Portal</p>
</div>
<div class="bg-white p-8 rounded-2xl login-card border border-blue-50">
<div class="flex border-b border-gray-100 mb-6">
<button class="flex-1 pb-3 text-sm font-bold tab-btn active" id="tabLogin" onclick="switchTab('login')">Login</button>
<button class="flex-1 pb-3 text-sm font-bold tab-btn" id="tabRegister" onclick="switchTab('register')">Register</button>
</div>
<div class="hidden mb-4 p-3 rounded-lg text-sm flex items-center gap-2" id="alertBox">
<span class="iconify" data-icon="" id="alertIcon"></span>
<span id="alertMsg"></span>
</div>
<form class="space-y-6" id="loginForm">
<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">Student ID / Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
<span class="iconify" data-icon="mdi:account-outline"></span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none placeholder-gray-300 text-gray-600" id="username" placeholder="Enter your student ID or email" type="text"/>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-2">
<label class="block text-sm font-semibold text-gray-700">Password</label>
<a class="text-xs text-gray-400 hover:text-blue-600 transition-colors" href="forgot-password.html">Forgot password?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
<span class="iconify" data-icon="mdi:lock-outline"></span>
</span>
<input class="block w-full pl-10 pr-12 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none placeholder-gray-300 text-gray-600" id="password" placeholder="Enter your password" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-blue-500" onclick="togglePassword()" type="button">
<span class="iconify" data-icon="mdi:eye-off-outline" id="passIcon"></span>
</button>
</div>
</div>
<button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md shadow-blue-200 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
<span id="btnText">Login</span>
<span class="hidden animate-spin iconify" data-icon="mdi:loading" id="loadingIcon"></span>
</button>
<p class="text-xs text-gray-400 mt-4">Default password for seeded TA accounts: 123456.</p>
</form>
<form class="space-y-6 hidden" id="registerForm">
<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
<span class="iconify" data-icon="mdi:account-outline"></span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none placeholder-gray-300 text-gray-600" id="regFullName" placeholder="Enter your full name" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
<span class="iconify" data-icon="mdi:email-outline"></span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none placeholder-gray-300 text-gray-600" id="regEmail" placeholder="your@email.com" type="email"/>
</div>
</div>
<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">Student ID</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
<span class="iconify" data-icon="mdi:card-account-details-outline"></span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none placeholder-gray-300 text-gray-600" id="regStudentId" placeholder="Enter your student ID" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
<span class="iconify" data-icon="mdi:at"></span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none placeholder-gray-300 text-gray-600" id="regUsername" placeholder="Choose a username" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
<span class="iconify" data-icon="mdi:lock-outline"></span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none placeholder-gray-300 text-gray-600" id="regPassword" placeholder="Choose a password" type="password"/>
</div>
</div>
<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">Confirm Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
<span class="iconify" data-icon="mdi:lock-outline"></span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none placeholder-gray-300 text-gray-600" id="regConfirmPassword" placeholder="Confirm your password" type="password"/>
</div>
</div>
<button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md shadow-blue-200 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
<span id="regBtnText">Register</span>
<span class="hidden animate-spin iconify" data-icon="mdi:loading" id="regLoadingIcon"></span>
</button>
</form>
<div class="mt-8 pt-6 border-t border-gray-100 flex items-center justify-center gap-4">
<span class="text-xs text-gray-400">Other methods:</span>
<button class="text-gray-400 hover:text-green-500 transition-colors">
<span class="iconify text-xl" data-icon="mdi:wechat"></span>
</button>
<button class="text-gray-400 hover:text-blue-400 transition-colors">
<span class="iconify text-xl" data-icon="mdi:qqchat"></span>
</button>
</div>
</div>
</div>
<div class="mt-8 text-center">
<p class="text-gray-400 text-xs">&copy; 2026 BUPT International School</p>
</div>
<script src="/js/api.js"></script>
<script>
    if (API.getToken() && API.getUser()?.role === 'TA') {
        window.location.href = 'dashboard.html';
    }

    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');
    const alertMsg = document.getElementById('alertMsg');
    const alertIcon = document.getElementById('alertIcon');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const btnText = document.getElementById('btnText');
    const loadingIcon = document.getElementById('loadingIcon');
    let alertTimer = null;

    function hideAlert() {
        clearTimeout(alertTimer);
        alertBox.classList.add('hidden');
    }

    function switchTab(tab) {
        document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
        document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
        loginForm.classList.toggle('hidden', tab !== 'login');
        registerForm.classList.toggle('hidden', tab !== 'register');
        hideAlert();
    }

    function showAlert(type, message, options = {}) {
        clearTimeout(alertTimer);
        alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'bg-green-50', 'text-green-700');
        if (type === 'error') {
            alertBox.classList.add('bg-red-50', 'text-red-700');
            alertIcon.setAttribute('data-icon', 'mdi:alert-circle-outline');
        } else {
            alertBox.classList.add('bg-green-50', 'text-green-700');
            alertIcon.setAttribute('data-icon', 'mdi:check-circle-outline');
        }
        alertMsg.innerText = message;
        if (options.autoHideMs) {
            alertTimer = setTimeout(() => {
                alertBox.classList.add('hidden');
            }, options.autoHideMs);
        }
    }

    usernameInput.addEventListener('input', hideAlert);
    passwordInput.addEventListener('input', hideAlert);
    document.getElementById('regFullName').addEventListener('input', hideAlert);
    document.getElementById('regEmail').addEventListener('input', hideAlert);
    document.getElementById('regStudentId').addEventListener('input', hideAlert);
    document.getElementById('regUsername').addEventListener('input', hideAlert);
    document.getElementById('regPassword').addEventListener('input', hideAlert);
    document.getElementById('regConfirmPassword').addEventListener('input', hideAlert);

    function togglePassword() {
        const passIcon = document.getElementById('passIcon');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            passIcon.setAttribute('data-icon', 'mdi:eye-outline');
        } else {
            passwordInput.type = 'password';
            passIcon.setAttribute('data-icon', 'mdi:eye-off-outline');
        }
    }

    loginForm.onsubmit = async (e) => {
        e.preventDefault();
        const identifier = usernameInput.value.trim();
        const pass = passwordInput.value.trim();

        if (!identifier || !pass) {
            showAlert('error', 'Please enter your student ID/email and password');
            return;
        }

        btnText.innerText = 'Verifying...';
        loadingIcon.classList.remove('hidden');

        try {
            const res = await API.post('/api/auth/login', { identifier, password: pass, portalRole: 'TA' });
            if (res.user && res.user.role !== 'TA') {
                showAlert('error', 'This portal is for TA accounts only.');
                btnText.innerText = 'Login';
                loadingIcon.classList.add('hidden');
                return;
            }
            API.setAuth(res.token, res.user);
            showAlert('success', 'Login successful. Redirecting...', { autoHideMs: 2000 });
            setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
        } catch (err) {
            showAlert('error', err.message || 'Invalid student ID, email, or password');
            btnText.innerText = 'Login';
            loadingIcon.classList.add('hidden');
        }
    };

    registerForm.onsubmit = async (e) => {
        e.preventDefault();
        const fullName = document.getElementById('regFullName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const studentId = document.getElementById('regStudentId').value.trim();
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const confirmPassword = document.getElementById('regConfirmPassword').value.trim();
        const regBtnText = document.getElementById('regBtnText');
        const regLoading = document.getElementById('regLoadingIcon');

        if (!fullName || !email || !studentId || !username || !password || !confirmPassword) {
            showAlert('error', 'Please fill in all fields');
            return;
        }
        if (password !== confirmPassword) {
            showAlert('error', 'Passwords do not match');
            return;
        }

        regBtnText.innerText = 'Registering...';
        regLoading.classList.remove('hidden');

        try {
            const res = await API.post('/api/auth/register', {
                username, password, role: 'TA', fullName, email, studentId
            });
            API.setAuth(res.token, res.user);
            showAlert('success', 'Registration successful. Redirecting...', { autoHideMs: 2000 });
            setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
        } catch (err) {
            showAlert('error', err.message || 'Registration failed');
            regBtnText.innerText = 'Register';
            regLoading.classList.add('hidden');
        }
    };
</script>
</body>
</html>
