<script>
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const alertBox = document.getElementById('alertBox');
        const alertMsg = document.getElementById('alertMsg');
        const alertIcon = document.getElementById('alertIcon');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const btnText = document.getElementById('btnText');
        const loadingIcon = document.getElementById('loadingIcon');

        const showRegisterBtn = document.getElementById('showRegisterBtn');
        const showLoginBtn = document.getElementById('showLoginBtn');
        const toggleHint = document.getElementById('toggleHint');
        const toggleHintBack = document.getElementById('toggleHintBack');

        const regUsernameInput = document.getElementById('regUsername');
        const regPasswordInput = document.getElementById('regPassword');
        const regConfirmPasswordInput = document.getElementById('regConfirmPassword');
        const regBtnText = document.getElementById('regBtnText');
        const regLoadingIcon = document.getElementById('regLoadingIcon');

        function showAlert(type, message) {
            alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'bg-green-50', 'text-green-700');
            if(type === 'error') {
                alertBox.classList.add('bg-red-50', 'text-red-700');
                alertIcon.setAttribute('data-icon', 'mdi:alert-circle-outline');
            } else {
                alertBox.classList.add('bg-green-50', 'text-green-700');
                alertIcon.setAttribute('data-icon', 'mdi:check-circle-outline');
            }
            alertMsg.innerText = message;
        }

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const passIcon = document.getElementById(iconId);
            if (!input || !passIcon) return;
            if (input.type === 'password') {
                input.type = 'text';
                passIcon.setAttribute('data-icon', 'mdi:eye-outline');
            } else {
                input.type = 'password';
                passIcon.setAttribute('data-icon', 'mdi:eye-off-outline');
            }
        }

        function showLogin() {
            alertBox.classList.add('hidden');
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
            toggleHint.classList.remove('hidden');
            toggleHintBack.classList.add('hidden');
        }

        function showRegister() {
            alertBox.classList.add('hidden');
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            toggleHint.classList.add('hidden');
            toggleHintBack.classList.remove('hidden');
        }

        showRegisterBtn.addEventListener('click', showRegister);
        showLoginBtn.addEventListener('click', showLogin);

        loginForm.onsubmit = (e) => {
            e.preventDefault();
            const user = usernameInput.value.trim();
            const pass = passwordInput.value.trim();

            if (!user || !pass) {
                showAlert('error', 'Please enter your account and password');
                return;
            }

            // Simulate login process
            btnText.innerText = 'Verifying...';
            loadingIcon.classList.remove('hidden');

            setTimeout(() => {
                if (user === '2026110123' && pass === 'bupt123456') {
                    showAlert('success', 'Login successful. Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    showAlert('error', 'Invalid account or password');
                    btnText.innerText = 'Login';
                    loadingIcon.classList.add('hidden');
                }
            }, 800);
        };

        registerForm.onsubmit = (e) => {
            e.preventDefault();
            const user = regUsernameInput.value.trim();
            const pass = regPasswordInput.value.trim();
            const confirmPass = regConfirmPasswordInput.value.trim();

            if (!user || !pass || !confirmPass) {
                showAlert('error', 'Please complete all registration fields');
                return;
            }

            if (pass.length < 6) {
                showAlert('error', 'Password must be at least 6 characters');
                return;
            }

            if (pass !== confirmPass) {
                showAlert('error', 'Passwords do not match');
                return;
            }

            regBtnText.innerText = 'Creating...';
            regLoadingIcon.classList.remove('hidden');

            setTimeout(() => {
                showAlert('success', 'Registration successful. Please login.');
                regBtnText.innerText = 'Create account';
                regLoadingIcon.classList.add('hidden');
                usernameInput.value = user;
                passwordInput.value = '';
                regPasswordInput.value = '';
                regConfirmPasswordInput.value = '';
                showLogin();
            }, 800);
        };
    </script>
