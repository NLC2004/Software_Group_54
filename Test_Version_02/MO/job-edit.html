<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Job - TA Recruitment MO System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8F9FC; }
        .nav-link { display: flex; align-items: center; padding: 0.75rem; border-radius: 0.75rem; transition: all 0.3s ease; }
        .nav-link.active { background-color: rgb(239 246 255); color: rgb(37 99 235); font-weight: 600; }
        .nav-link.inactive { color: rgb(100 116 139); }
        .nav-link.inactive:hover { background-color: rgb(248 250 252); color: rgb(37 99 235); }
        .form-input { display: block; width: 100%; background-color: white; border: 1px solid rgb(229 231 235); border-radius: 1rem; padding: 0.75rem 1rem; transition: all 0.3s ease; outline: none; }
        .form-input:focus { border-color: rgb(59 130 246); box-shadow: 0 0 0 3px rgba(59 130 246, 0.1); }
        .glass-effect { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="flex min-h-screen">
<!-- Sidebar -->
<aside class="w-64 bg-white border-r border-gray-100 flex flex-col fixed h-full z-50">
<div class="p-6 flex items-center space-x-3">
<div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white">
<span class="iconify text-2xl" data-icon="solar:library-bold"></span>
</div>
<span class="text-xl font-bold text-gray-800 tracking-tight">EduMO</span>
</div>
<nav class="flex-1 mt-4 px-4 space-y-2">
<a class="nav-link inactive" id="navDashboard" href="my-job-list.html">
<span class="iconify mr-3 text-xl" data-icon="solar:widget-4-bold"></span>
<span>Dashboard</span>
</a>
<a class="nav-link inactive" id="navStatistics" href="statistics-analysis.html">
<span class="iconify mr-3 text-xl" data-icon="solar:chart-2-bold"></span>
<span>Statistics</span>
</a>
<a class="nav-link inactive" id="navNotifications" href="notifications-messages.html">
<span class="iconify mr-3 text-xl" data-icon="solar:bell-bing-bold"></span>
<span>Notifications</span>
</a>
<a class="nav-link inactive" id="navProfile" href="personal-center.html">
<span class="iconify mr-3 text-xl" data-icon="solar:user-circle-bold"></span>
<span>Profile Settings</span>
</a>
</nav>
<div class="p-4 border-t border-gray-100 mt-auto">
<div class="bg-gray-50 p-4 rounded-xl flex items-center gap-3">
<img alt="Avatar" class="w-10 h-10 rounded-full border border-gray-200 object-cover" src="https://modao.cc/agent-py/media/generated_images/2026-03-21/bc2fcb312e504b8ca61689559e7c92b5.jpg"/>
<div class="flex-1 overflow-hidden min-w-0">
<p class="text-sm font-bold text-gray-800 truncate" data-user-name>MO User</p>
<p class="text-[10px] text-gray-400 truncate" data-user-role>Management Office</p>
</div>
<a class="text-gray-400 hover:text-red-500 shrink-0 cursor-pointer" id="logoutBtn" title="Logout">
<span class="iconify text-lg" data-icon="mdi:logout"></span>
</a>
</div>
<a class="mt-3 hidden w-full items-center justify-center px-3 py-2 rounded-xl border border-gray-200 bg-white text-gray-700 text-sm font-semibold hover:bg-gray-50 transition-all" href="../admin/job-supervision.html" id="backToAdminBtn">
<span class="iconify mr-2 text-base" data-icon="solar:arrow-left-linear"></span>
Back to Admin
</a>
</div>
</aside>
<!-- Main Content -->
<main class="ml-64 flex-1 flex flex-col">
<header class="h-16 bg-white/80 glass-effect border-b border-gray-100 flex items-center px-8">
<div class="flex items-center space-x-2 text-sm text-gray-500">
<a class="hover:text-blue-600" id="breadcrumbJobsLink" href="my-job-list.html">Jobs</a>
<span class="iconify" data-icon="solar:alt-arrow-right-linear"></span>
<span class="text-gray-900 font-medium italic underline" id="breadcrumbTitle">Edit Job</span>
</div>
</header>
<div class="p-8 max-w-4xl mx-auto w-full">
<div class="mb-10 flex items-center justify-between">
<div>
<h1 class="text-3xl font-black text-gray-800 mb-2">Modify Position</h1>
<p class="text-gray-400">Update the recruitment details for this position.</p>
</div>
<div class="px-5 py-2 text-xs font-bold rounded-full border" id="statusBadge">Loading...</div>
</div>
<form class="space-y-8 pb-20" id="editJobForm">
<!-- Section 1: Basic Info -->
<section class="bg-white p-8 rounded-[2rem] shadow-sm border border-gray-100">
<div class="flex items-center mb-6 space-x-3">
<div class="p-2 bg-blue-50 text-blue-600 rounded-lg"><span class="iconify text-xl" data-icon="solar:info-square-bold"></span></div>
<h3 class="text-lg font-bold text-gray-800">Job Specification</h3>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="text-sm font-semibold text-gray-600 ml-1">Job Title *</label>
<input class="form-input" id="jobTitle" type="text" required/>
</div>
<div class="space-y-2">
<label class="text-sm font-semibold text-gray-600 ml-1">Course Name</label>
<input class="form-input" id="courseName" type="text"/>
</div>
<div class="space-y-2">
<label class="text-sm font-semibold text-gray-600 ml-1">Type</label>
<select class="form-input" id="jobType">
<option value="COURSE">Course TA</option>
<option value="ACTIVITY">Activity Assistant</option>
</select>
</div>
<div class="space-y-2">
<label class="text-sm font-semibold text-gray-600 ml-1">Deadline</label>
<input class="form-input" id="deadline" type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="YYYY-MM-DD" title="Format: YYYY-MM-DD (e.g. 2026-04-05)"/>
</div>
<div class="space-y-2">
<label class="text-sm font-semibold text-gray-600 ml-1">Quota</label>
<input class="form-input" id="quota" type="number" min="1"/>
</div>
<div class="space-y-2">
<label class="text-sm font-semibold text-gray-600 ml-1">Schedule</label>
<input class="form-input" id="schedule" type="text"/>
</div>
</div>
</section>
<!-- Section 2: Pay & Hours -->
<section class="bg-white p-8 rounded-[2rem] shadow-sm border border-gray-100">
<div class="flex items-center mb-6 space-x-3">
<div class="p-2 bg-green-50 text-green-600 rounded-lg"><span class="iconify text-xl" data-icon="solar:card-2-bold"></span></div>
<h3 class="text-lg font-bold text-gray-800">Details</h3>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="text-sm font-semibold text-gray-600 ml-1">Weekly Hours</label>
<input class="form-input" id="weeklyHours" type="number"/>
</div>
<div class="md:col-span-2 space-y-2">
<label class="text-sm font-semibold text-gray-600 ml-1">Description</label>
<textarea class="form-input" id="description" rows="4"></textarea>
</div>
<div class="md:col-span-2 space-y-2">
<label class="text-sm font-semibold text-gray-600 ml-1">Requirements (press Enter to add)</label>
<div class="flex items-center gap-2 mb-2">
<input class="form-input flex-1" id="reqInput" placeholder="Add a requirement..." type="text"/>
<button type="button" onclick="addRequirement()" class="px-4 py-3 bg-blue-600 text-white rounded-xl text-sm font-semibold hover:bg-blue-700">Add</button>
</div>
<div class="flex flex-wrap gap-2" id="reqTags"></div>
</div>
</div>
</section>
<div class="flex items-center justify-end space-x-4">
<a class="px-8 py-3 rounded-2xl font-bold text-red-400 hover:bg-red-50 transition-all" id="cancelLink" href="my-job-list.html">Cancel Changes</a>
<button type="submit" class="px-10 py-3 bg-blue-600 text-white rounded-2xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 hover:-translate-y-1 transition-all" id="updateBtn">Update Information</button>
</div>
</form>
</div>
</main>
<script src="/js/api.js"></script>
<script>
        const requirements = [];
        let jobId = null;

        function parseDeadlineField(raw) {
            const t = String(raw || '').trim();
            if (!t) return { ok: true, value: null };
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t);
            if (!m) return { ok: false, message: 'Please enter deadline as YYYY-MM-DD (e.g. 2026-04-05).' };
            const y = +m[1], mo = +m[2], d = +m[3];
            const dt = new Date(y, mo - 1, d);
            if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) {
                return { ok: false, message: 'Invalid deadline date.' };
            }
            return { ok: true, value: t };
        }

        (async function init() {
            const user = requireAuth(['MO', 'ADMIN']);
            if (!user) return;
            updateSidebarUser(user);
            document.getElementById('logoutBtn').onclick = () => logout();
            if (user.role === 'ADMIN') {
                const backBtn = document.getElementById('backToAdminBtn');
                if (backBtn) {
                    backBtn.classList.remove('hidden');
                    backBtn.classList.add('flex');
                }
            }

            jobId = getUrlParam('id');
            if (!jobId) { showToast('No job ID specified', 'error'); return; }

            document.getElementById('cancelLink').href = user.role === 'ADMIN'
                ? '../admin/job-supervision.html'
                : ('job-detail.html?id=' + jobId);

            try {
                const job = await API.get('/api/jobs/' + jobId);
                populateForm(job);
            } catch (err) {
                showToast(err.message || 'Failed to load job', 'error');
            }
        })();

        function populateForm(job) {
            document.getElementById('breadcrumbTitle').textContent = 'Edit: ' + (job.title || '');
            document.getElementById('jobTitle').value = job.title || '';
            document.getElementById('courseName').value = job.courseName || '';
            document.getElementById('jobType').value = job.type || 'COURSE';
            document.getElementById('deadline').value = job.deadline ? job.deadline.substring(0, 10) : '';
            document.getElementById('quota').value = job.quota || '';
            document.getElementById('schedule').value = job.schedule || '';
            document.getElementById('weeklyHours').value = job.weeklyHours || '';
            document.getElementById('description').value = job.description || '';

            const badge = document.getElementById('statusBadge');
            if (job.status === 'OPEN') {
                badge.textContent = 'STATUS: ACTIVE';
                badge.className = 'px-5 py-2 bg-green-50 text-green-600 text-xs font-bold rounded-full border border-green-100';
            } else {
                badge.textContent = 'STATUS: CLOSED';
                badge.className = 'px-5 py-2 bg-gray-100 text-gray-500 text-xs font-bold rounded-full border border-gray-200';
            }

            requirements.length = 0;
            if (Array.isArray(job.requirements)) {
                job.requirements.forEach(r => requirements.push(r));
            }
            renderReqTags();
        }

        document.getElementById('reqInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); addRequirement(); }
        });

        function addRequirement() {
            const input = document.getElementById('reqInput');
            const val = input.value.trim();
            if (!val) return;
            requirements.push(val);
            input.value = '';
            renderReqTags();
        }

        function removeRequirement(idx) {
            requirements.splice(idx, 1);
            renderReqTags();
        }

        function renderReqTags() {
            document.getElementById('reqTags').innerHTML = requirements.map((r, i) =>
                `<span class="bg-gray-100 px-3 py-1 rounded-full text-xs font-medium text-gray-600 flex items-center">${esc(r)} <span class="ml-2 cursor-pointer text-gray-400 hover:text-red-500" onclick="removeRequirement(${i})">&times;</span></span>`
            ).join('');
        }

        document.getElementById('editJobForm').onsubmit = async (e) => {
            e.preventDefault();

            const dl = parseDeadlineField(document.getElementById('deadline').value);
            if (!dl.ok) { showToast(dl.message, 'warning'); return; }

            const btn = document.getElementById('updateBtn');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            const body = {
                title: document.getElementById('jobTitle').value.trim(),
                type: document.getElementById('jobType').value,
                courseName: document.getElementById('courseName').value.trim(),
                description: document.getElementById('description').value.trim(),
                requirements: requirements,
                quota: parseInt(document.getElementById('quota').value) || 1,
                weeklyHours: parseFloat(document.getElementById('weeklyHours').value) || 0,
                schedule: document.getElementById('schedule').value.trim(),
                deadline: dl.value
            };

            try {
                await API.put('/api/jobs/' + jobId, body);
                showToast('Job updated successfully!', 'success');
                setTimeout(() => {
                    window.location.href = user.role === 'ADMIN'
                        ? '../admin/job-supervision.html'
                        : ('job-detail.html?id=' + jobId);
                }, 800);
            } catch (err) {
                showToast(err.message || 'Failed to update job', 'error');
                btn.disabled = false;
                btn.textContent = 'Update Information';
            }
        };
    </script>
</body>
</html>
