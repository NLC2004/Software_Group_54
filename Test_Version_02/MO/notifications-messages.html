<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Notifications - EduMO System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8F9FC; color: #1E293B; }
        .nav-link { display: flex; align-items: center; padding: 0.75rem; border-radius: 0.75rem; transition: all 0.3s ease; }
        .nav-link.active { background-color: rgb(239 246 255); color: rgb(37 99 235); font-weight: 600; }
        .nav-link.inactive { color: rgb(100 116 139); }
        .nav-link.inactive:hover { background-color: rgb(248 250 252); color: rgb(37 99 235); }
        .msg-item { padding: 1.5rem; border-bottom: 1px solid rgb(241 245 249); transition: all 0.3s ease; cursor: pointer; display: flex; align-items: flex-start; gap: 1rem; position: relative; }
        .msg-item:hover { background-color: rgba(59, 130, 246, 0.05); }
        .msg-unread::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 6px; height: 40px; background-color: rgb(37 99 235); border-radius: 0 6px 6px 0; }
    </style>
</head>
<body class="flex min-h-screen">
<!-- Sidebar -->
<aside class="w-64 bg-white border-r border-slate-100 flex flex-col fixed h-full z-50">
<div class="p-6 flex items-center space-x-3">
<div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white">
<span class="iconify text-2xl" data-icon="solar:library-bold"></span>
</div>
<span class="text-xl font-black text-slate-800 tracking-tight">EduMO</span>
</div>
<nav class="flex-1 mt-4 px-4 space-y-2">
<a class="nav-link inactive" href="my-job-list.html">
<span class="iconify mr-3 text-xl" data-icon="solar:widget-4-bold"></span>
<span>Dashboard</span>
</a>
<a class="nav-link inactive" href="statistics-analysis.html">
<span class="iconify mr-3 text-xl" data-icon="solar:chart-2-bold"></span>
<span>Statistics</span>
</a>
<a class="nav-link active" href="notifications-messages.html">
<span class="iconify mr-3 text-xl" data-icon="solar:bell-bing-bold"></span>
<span>Notifications</span>
</a>
<a class="nav-link inactive" href="personal-center.html">
<span class="iconify mr-3 text-xl" data-icon="solar:user-circle-bold"></span>
<span>Profile Settings</span>
</a>
</nav>
<div class="p-6 mt-auto space-y-3">
<div class="bg-slate-900 p-6 rounded-3xl text-white transform hover:rotate-2 transition-transform">
<p class="text-[10px] font-black uppercase text-slate-400 mb-2">Support</p>
<p class="text-xs leading-relaxed mb-4">Having issues? Our helpdesk is open 24/7.</p>
<button class="bg-blue-600 w-full py-2 rounded-xl text-[11px] font-bold">Contact Admin</button>
</div>
<div class="bg-gray-50 p-4 rounded-xl flex items-center gap-3 border border-slate-100">
<img alt="Avatar" class="w-10 h-10 rounded-full border border-gray-200 object-cover" src="https://modao.cc/agent-py/media/generated_images/2026-03-21/bc2fcb312e504b8ca61689559e7c92b5.jpg"/>
<div class="flex-1 overflow-hidden min-w-0">
<p class="text-sm font-bold text-gray-800 truncate" data-user-name>MO User</p>
<p class="text-[10px] text-gray-400 truncate" data-user-role>Management Office</p>
</div>
<a class="text-gray-400 hover:text-red-500 shrink-0 cursor-pointer" id="logoutBtn" title="Logout">
<span class="iconify text-lg" data-icon="mdi:logout"></span>
</a>
</div>
</div>
</aside>
<!-- Main Content -->
<main class="ml-64 flex-1 flex flex-col h-screen">
<header class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-100 flex items-center justify-between px-8 shrink-0">
<div>
<h1 class="text-2xl font-black text-slate-800">Messages</h1>
<p class="text-xs text-slate-400 font-medium tracking-tight mt-0.5">You have <span class="text-blue-600" id="unreadCount">0 unread</span> notifications</p>
</div>
<div class="flex items-center space-x-3">
<button class="px-6 py-2.5 bg-slate-100 text-slate-600 rounded-2xl text-xs font-bold hover:bg-slate-200 transition-all" id="markAllReadBtn">Mark all as read</button>
</div>
</header>
<div class="flex-1 overflow-hidden flex">
<!-- Message List -->
<div class="w-[450px] bg-white border-r border-slate-100 overflow-y-auto" id="messageList">
<div class="p-8 text-center text-gray-400">Loading notifications...</div>
</div>
<!-- Message Content -->
<div class="flex-1 bg-slate-50 p-12 flex flex-col items-center justify-center text-center" id="messageContent">
<div class="max-w-md">
<div class="w-32 h-32 bg-white rounded-full flex items-center justify-center border border-slate-200 shadow-sm mx-auto mb-8">
<span class="iconify text-5xl text-blue-100" data-icon="solar:mailbox-bolt-linear"></span>
</div>
<h2 class="text-xl font-black text-slate-800 mb-3">Select a message</h2>
<p class="text-slate-400 leading-relaxed text-sm">Pick a notification from the list on the left to view the full details.</p>
</div>
</div>
</div>
</main>
<script src="/js/api.js"></script>
<script>
        let notifications = [];

        (async function init() {
            const user = requireAuth(['MO']);
            if (!user) return;
            updateSidebarUser(user);
            document.getElementById('logoutBtn').onclick = () => logout();
            document.getElementById('markAllReadBtn').onclick = markAllRead;

            await loadNotifications();
        })();

        async function loadNotifications() {
            try {
                notifications = await API.get('/api/notifications');
                renderNotifications();
            } catch (err) {
                showToast(err.message || 'Failed to load notifications', 'error');
                document.getElementById('messageList').innerHTML = '<div class="p-8 text-center text-red-400">Failed to load</div>';
            }
        }

        function renderNotifications() {
            const unread = notifications.filter(n => !n.read).length;
            document.getElementById('unreadCount').textContent = unread + ' unread';

            const list = document.getElementById('messageList');
            if (notifications.length === 0) {
                list.innerHTML = '<div class="p-8 text-center text-gray-400">No notifications yet</div>';
                return;
            }

            list.innerHTML = notifications.map(n => {
                const isUnread = !n.read;
                const iconMap = {
                    'APPLICATION': 'solar:user-plus-bold',
                    'SYSTEM': 'solar:shield-warning-bold',
                    'APPROVAL': 'solar:check-circle-bold'
                };
                const colorMap = {
                    'APPLICATION': 'bg-blue-50 text-blue-600',
                    'SYSTEM': 'bg-slate-50 text-slate-400',
                    'APPROVAL': 'bg-green-50 text-green-600'
                };
                const icon = iconMap[n.type] || 'solar:bell-bing-bold';
                const color = colorMap[n.type] || 'bg-orange-50 text-orange-600';
                const time = n.createdAt ? timeAgo(n.createdAt) : '';

                return `
                <div class="msg-item ${isUnread ? 'msg-unread' : ''}" onclick="selectNotification('${safeJsStr(n.id)}')">
                    <div class="w-12 h-12 ${color} rounded-2xl flex-shrink-0 flex items-center justify-center">
                        <span class="iconify text-2xl" data-icon="${icon}"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start mb-1">
                            <h4 class="text-sm ${isUnread ? 'font-bold' : 'font-medium'} text-slate-800 truncate pr-2">${esc(n.title || 'Notification')}</h4>
                            <span class="text-[10px] ${isUnread ? 'text-blue-600 font-black' : 'text-slate-400 font-medium'} shrink-0">${esc(time).toUpperCase()}</span>
                        </div>
                        <p class="text-xs text-slate-500 line-clamp-2">${esc(n.content || '')}</p>
                    </div>
                </div>`;
            }).join('');
        }

        async function selectNotification(id) {
            const n = notifications.find(x => x.id === id);
            if (!n) return;

            const content = document.getElementById('messageContent');
            content.innerHTML = `
                <div class="max-w-lg text-left w-full">
                    <h2 class="text-2xl font-black text-slate-800 mb-4">${esc(n.title || 'Notification')}</h2>
                    <p class="text-sm text-slate-400 mb-6">${n.createdAt ? formatDateTime(n.createdAt) : ''}</p>
                    <div class="bg-white p-8 rounded-2xl border border-slate-100 shadow-sm">
                        <p class="text-slate-600 leading-relaxed">${esc(n.content || '')}</p>
                    </div>
                </div>`;

            if (!n.read) {
                try {
                    await API.put('/api/notifications/' + id + '/read');
                    n.read = true;
                    renderNotifications();
                } catch (err) {}
            }
        }

        async function markAllRead() {
            try {
                await API.put('/api/notifications/read-all');
                notifications.forEach(n => n.read = true);
                renderNotifications();
                showToast('All notifications marked as read', 'success');
            } catch (err) {
                showToast(err.message || 'Failed to mark all as read', 'error');
            }
        }
    </script>
</body>
</html>
