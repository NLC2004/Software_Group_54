<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Job Details - TA Recruitment MO System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8F9FC; }
        .nav-link { display: flex; align-items: center; padding: 0.75rem; border-radius: 0.75rem; transition: all 0.3s ease; }
        .nav-link.active { background-color: rgb(239 246 255); color: rgb(37 99 235); font-weight: 600; }
        .nav-link.inactive { color: rgb(100 116 139); }
        .nav-link.inactive:hover { background-color: rgb(248 250 252); color: rgb(37 99 235); }
        .glass-effect { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="flex min-h-screen">
<!-- Sidebar -->
<aside class="w-64 bg-white border-r border-gray-100 flex flex-col fixed h-full z-50">
<div class="p-6 flex items-center space-x-3">
<div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white">
<span class="iconify text-2xl" data-icon="solar:library-bold"></span>
</div>
<span class="text-xl font-bold text-gray-800 tracking-tight">EduMO</span>
</div>
<nav class="flex-1 mt-4 px-4 space-y-2">
<a class="nav-link inactive" id="navDashboard" href="my-job-list.html">
<span class="iconify mr-3 text-xl" data-icon="solar:widget-4-bold"></span>
<span>Dashboard</span>
</a>
<a class="nav-link inactive" id="navStatistics" href="statistics-analysis.html">
<span class="iconify mr-3 text-xl" data-icon="solar:chart-2-bold"></span>
<span>Statistics</span>
</a>
<a class="nav-link inactive" id="navNotifications" href="notifications-messages.html">
<span class="iconify mr-3 text-xl" data-icon="solar:bell-bing-bold"></span>
<span>Notifications</span>
</a>
<a class="nav-link inactive" id="navProfile" href="personal-center.html">
<span class="iconify mr-3 text-xl" data-icon="solar:user-circle-bold"></span>
<span>Profile Settings</span>
</a>
</nav>
<div class="p-4 border-t border-gray-100 mt-auto">
<div class="bg-gray-50 p-4 rounded-xl flex items-center gap-3">
<img alt="Avatar" class="w-10 h-10 rounded-full border border-gray-200 object-cover" src="https://modao.cc/agent-py/media/generated_images/2026-03-21/bc2fcb312e504b8ca61689559e7c92b5.jpg"/>
<div class="flex-1 overflow-hidden min-w-0">
<p class="text-sm font-bold text-gray-800 truncate" data-user-name>MO User</p>
<p class="text-[10px] text-gray-400 truncate" data-user-role>Management Office</p>
</div>
<a class="text-gray-400 hover:text-red-500 shrink-0 cursor-pointer" id="logoutBtn" title="Logout">
<span class="iconify text-lg" data-icon="mdi:logout"></span>
</a>
</div>
<a class="mt-3 hidden w-full items-center justify-center px-3 py-2 rounded-xl border border-gray-200 bg-white text-gray-700 text-sm font-semibold hover:bg-gray-50 transition-all" href="../admin/job-supervision.html" id="backToAdminBtn">
<span class="iconify mr-2 text-base" data-icon="solar:arrow-left-linear"></span>
Back to Admin
</a>
</div>
</aside>
<!-- Main Content -->
<main class="ml-64 flex-1 flex flex-col min-w-0">
<header class="h-16 bg-white/80 glass-effect border-b border-gray-100 flex items-center justify-between px-8 sticky top-0 z-40">
<div class="flex items-center space-x-2 text-sm text-gray-500">
<a class="hover:text-blue-600" id="breadcrumbJobsLink" href="my-job-list.html">Jobs</a>
<span class="iconify" data-icon="solar:alt-arrow-right-linear"></span>
<span class="text-gray-900 font-medium tracking-tight" id="breadcrumbTitle">Loading...</span>
</div>
<div class="flex space-x-3" id="headerActions"></div>
</header>
<div class="p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
<!-- Left: Job Info -->
<div class="lg:col-span-1 space-y-6">
<div class="bg-white p-8 rounded-[2rem] card-shadow border border-gray-50" id="jobInfoPanel">
<div class="text-center py-8 text-gray-400">Loading job details...</div>
</div>
</div>
<!-- Right: Applicants List -->
<div class="lg:col-span-2 space-y-6">
<div class="flex items-center justify-between">
<h3 class="text-xl font-bold text-gray-800 flex items-center">
    Applicants
    <span class="ml-3 px-3 py-1 bg-blue-100 text-blue-600 text-xs rounded-full" id="applicantCount">0</span>
</h3>
<div class="flex flex-wrap items-center gap-3">
<select class="px-3 py-2 border border-gray-200 rounded-xl text-sm text-gray-700 bg-white" id="moApplicantSort">
<option value="priority-asc">Sort: Priority 1 → 3</option>
<option value="priority-desc">Sort: Priority 3 → 1</option>
<option value="submitted-desc">Sort: Latest first</option>
<option value="submitted-asc">Sort: Earliest first</option>
</select>
<label class="inline-flex items-center gap-2 px-3 py-2 bg-white border border-gray-200 rounded-xl text-sm text-gray-700">
<input id="filterPriority1" type="checkbox"/>
                        show only priority 1
                    </label>
<label class="inline-flex items-center gap-2 px-3 py-2 bg-white border border-gray-200 rounded-xl text-sm text-gray-700">
<input id="filterPendingOnly" type="checkbox"/>
                        show only pending
                    </label>
</div>
</div>
<div class="space-y-4" id="applicantList">
<div class="text-center py-8 text-gray-400">Loading applicants...</div>
</div>
</div>
</div>
</main>

<div class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4" id="appDetailModal" style="z-index:60;">
<div class="bg-white w-full max-w-2xl rounded-[1.5rem] shadow-2xl border border-gray-100 overflow-hidden">
<div class="p-5 border-b border-gray-100 flex items-center justify-between">
<div>
<h3 class="text-lg font-bold text-gray-900" id="appDetailTitle">Application Detail</h3>
<p class="text-xs text-gray-400 mt-1" id="appDetailSub">--</p>
</div>
<button class="p-2 hover:bg-gray-100 rounded-xl text-gray-500" id="closeAppDetailBtn" type="button">
<span class="iconify text-xl" data-icon="mdi:close"></span>
</button>
</div>
<div class="p-6 space-y-6" id="appDetailBody"></div>
</div>
</div>

<script src="/js/api.js"></script>
<script>
        let jobId = null;
        let currentApplications = [];
        let currentPortalUser = null;
        let moApplicantSort = 'priority-asc';
        let moPriority1Only = false;
        let moPendingOnly = false;

        (async function init() {
            const user = requireAuth(['MO', 'ADMIN']);
            if (!user) return;
            currentPortalUser = user;
            updateSidebarUser(user);
            document.getElementById('logoutBtn').onclick = () => logout();
            if (user.role === 'ADMIN') {
                const backBtn = document.getElementById('backToAdminBtn');
                if (backBtn) {
                    backBtn.classList.remove('hidden');
                    backBtn.classList.add('flex');
                }
            }

            jobId = getUrlParam('id');
            if (!jobId) { showToast('No job ID specified', 'error'); return; }

            try {
                const [job, applications] = await Promise.all([
                    API.get('/api/jobs/' + jobId),
                    API.get('/api/jobs/' + jobId + '/applications')
                ]);
                renderJobInfo(job);
                renderApplicants(applications);
            } catch (err) {
                showToast(err.message || 'Failed to load data', 'error');
            }
        })();

        function getPriorityRank(value) {
            const num = Number(value || 0);
            return num > 0 ? num : 99;
        }

        function formatJobType(t) {
            const raw = String(t || '').trim();
            const tv = raw === 'COURSE' ? 'COURSE_TA' : (raw === 'ACTIVITY' ? 'CLASS_TEST_TA' : raw);
            const map = {
                COURSE_TA: 'Course TA',
                LAB_TA: 'Lab TA',
                FINAL_EXAM_TA: 'Final Exam TA',
                CLASS_TEST_TA: 'Class Test TA'
            };
            return map[tv] || tv || '';
        }

        function getFilteredApplicants(applications) {
            let list = Array.isArray(applications) ? [...applications] : [];
            if (moPriority1Only) {
                list = list.filter(app => Number(app.priority || 0) === 1);
            }
            if (moPendingOnly) {
                list = list.filter(app => String(app.status || '') === 'PENDING');
            }
            list.sort((a, b) => {
                if (moApplicantSort === 'priority-desc') {
                    const diff = getPriorityRank(b.priority) - getPriorityRank(a.priority);
                    if (diff !== 0) return diff;
                } else if (moApplicantSort === 'submitted-desc') {
                    return Number(b.createdAt || 0) - Number(a.createdAt || 0);
                } else if (moApplicantSort === 'submitted-asc') {
                    return Number(a.createdAt || 0) - Number(b.createdAt || 0);
                } else {
                    const diff = getPriorityRank(a.priority) - getPriorityRank(b.priority);
                    if (diff !== 0) return diff;
                }
                return Number(b.createdAt || 0) - Number(a.createdAt || 0);
            });
            return list;
        }

        function renderJobInfo(job) {
            document.getElementById('breadcrumbTitle').textContent = job.title || 'Job Detail';

            const isOpen = job.status === 'OPEN';
            document.getElementById('headerActions').innerHTML = `
                <a class="px-4 py-2 border border-gray-200 rounded-xl text-sm font-semibold hover:bg-gray-50 transition-all" href="job-edit.html?id=${job.id}">Edit Job</a>
                <button onclick="toggleStatus('${isOpen ? 'CLOSED' : 'OPEN'}')" class="px-4 py-2 ${isOpen ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600'} rounded-xl text-sm font-semibold hover:opacity-80 transition-all">${isOpen ? 'Close Recruitment' : 'Reopen Recruitment'}</button>
                <button onclick="deleteJob()" class="px-4 py-2 bg-red-50 text-red-600 rounded-xl text-sm font-semibold hover:bg-red-100 transition-all">Delete</button>`;

            const reqHtml = Array.isArray(job.requirements) && job.requirements.length > 0
                ? job.requirements.map(r => `<li class="flex items-start"><span class="iconify mt-1 mr-2 text-green-500" data-icon="solar:check-circle-bold"></span> ${esc(r)}</li>`).join('')
                : '<li class="text-gray-400 italic">No specific requirements listed</li>';

            document.getElementById('jobInfoPanel').innerHTML = `
                <div class="flex items-center space-x-4 mb-6">
                    <div class="w-16 h-16 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-600">
                        <span class="iconify text-3xl" data-icon="solar:code-bold"></span>
                    </div>
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800">${esc(job.courseName || job.title || '')}</h2>
                        <p class="text-sm text-gray-400 font-medium">${esc(formatJobType(job.type))} &middot; ${statusBadge(job.status)}</p>
                    </div>
                </div>
                <div class="space-y-4">
                    <div class="p-4 bg-gray-50 rounded-2xl">
                        <p class="text-xs text-gray-400 uppercase font-bold tracking-wider mb-1">Position Title</p>
                        <p class="text-gray-800 font-semibold">${esc(job.title || '')}</p>
                    </div>
                    <div class="p-4 bg-gray-50 rounded-2xl">
                        <p class="text-xs text-gray-400 uppercase font-bold tracking-wider mb-1">Schedule</p>
                        <p class="text-gray-800 font-semibold italic">${esc(job.schedule || 'Not specified')}</p>
                    </div>
                    <div class="p-4 bg-gray-50 rounded-2xl">
                        <p class="text-xs text-gray-400 uppercase font-bold tracking-wider mb-1">Quota / Weekly Hours</p>
                        <p class="text-gray-800 font-semibold">${job.quota || 'N/A'} positions &middot; ${job.weeklyHours || 'N/A'} hrs/week</p>
                    </div>
                    <div class="p-4 bg-gray-50 rounded-2xl">
                        <p class="text-xs text-gray-400 uppercase font-bold tracking-wider mb-1">Deadline</p>
                        <p class="text-gray-800 font-semibold">${job.deadline ? formatDate(job.deadline) : 'Not set'}</p>
                    </div>
                </div>
                ${job.description ? `<div class="mt-6 border-t border-gray-100 pt-6"><h4 class="font-bold text-gray-800 mb-3">Description</h4><p class="text-sm text-gray-500 leading-relaxed">${esc(job.description)}</p></div>` : ''}
                <div class="mt-6 border-t border-gray-100 pt-6">
                    <h4 class="font-bold text-gray-800 mb-3">Requirements</h4>
                    <ul class="text-sm text-gray-500 space-y-2">${reqHtml}</ul>
                </div>`;
        }

        function renderApplicants(applications) {
            const container = document.getElementById('applicantList');
            currentApplications = applications || [];
            const visibleApplications = getFilteredApplicants(currentApplications);
            document.getElementById('applicantCount').textContent = visibleApplications.length + ' Visible';

            if (visibleApplications.length === 0) {
                container.innerHTML = '<div class="bg-white p-8 rounded-3xl border border-gray-50 card-shadow text-center text-gray-400">No applications yet</div>';
                return;
            }

            container.innerHTML = visibleApplications.map(app => {
                const statusColor = app.status === 'APPROVED' ? 'text-green-500'
                    : app.status === 'REJECTED' ? 'text-red-500'
                    : 'text-blue-400';
                const priorityValue = Number(app.priority || 0);
                const priorityLabel = priorityValue > 0 ? `Priority ${priorityValue}` : 'No priority';
                const priorityBadgeClass = priorityValue > 0
                    ? 'bg-indigo-50 text-indigo-600 border-indigo-100'
                    : 'bg-gray-100 text-gray-500 border-gray-200';

                const cvButton = app.cvFileName
                    ? `<button onclick="event.stopPropagation(); viewCV('${safeJsStr(app.cvFileName)}')" class="p-2 bg-blue-50 text-blue-600 rounded-xl hover:bg-blue-100" title="View CV"><span class="iconify text-xl" data-icon="solar:document-bold"></span></button>`
                    : '';

                const actionButtons = app.status === 'PENDING' ? `
                    <button onclick="updateAppStatus('${safeJsStr(app.id)}', 'APPROVED')" class="p-2 bg-green-50 text-green-600 rounded-xl hover:bg-green-100" title="Approve"><span class="iconify text-xl" data-icon="solar:check-read-bold"></span></button>
                    <button onclick="updateAppStatus('${safeJsStr(app.id)}', 'REJECTED')" class="p-2 bg-red-50 text-red-600 rounded-xl hover:bg-red-100" title="Reject"><span class="iconify text-xl" data-icon="solar:close-circle-bold"></span></button>`
                    : `<span class="px-3 py-1 text-xs font-bold rounded-full ${app.status === 'APPROVED' ? 'bg-green-50 text-green-600' : 'bg-red-50 text-red-600'}">${esc(app.status)}</span>`;

                return `
                <div class="bg-white p-6 rounded-3xl border border-gray-50 card-shadow hover:border-blue-200 transition-all flex items-center justify-between group cursor-pointer" onclick="openApplicationDetail('${safeJsStr(app.id)}')">
                    <div class="flex items-center space-x-4">
                        <div class="w-14 h-14 rounded-2xl border-2 border-blue-50 bg-blue-50 flex items-center justify-center text-blue-600">
                            <span class="iconify text-2xl" data-icon="solar:user-bold"></span>
                        </div>
                        <div>
                            <h4 class="font-bold text-gray-800">${esc(app.applicantName || 'Unknown')}</h4>
                            <p class="text-xs text-gray-400">${esc(app.applicantEmail || '')} ${app.applicantStudentId ? '&middot; ID: ' + esc(app.applicantStudentId) : ''}</p>
                            <div class="mt-2"><span class="inline-flex px-3 py-1 rounded-full border text-[11px] font-bold ${priorityBadgeClass}">${esc(priorityLabel)}</span></div>
                            <p class="text-[10px] text-gray-300 mt-1">${app.createdAt ? timeAgo(app.createdAt) : ''}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="text-right mr-2">
                            <div class="text-xs text-gray-400 font-bold uppercase mb-1">Status</div>
                            <div class="text-lg font-black ${statusColor}">${esc(app.status || 'PENDING')}</div>
                        </div>
                        <div class="flex space-x-2">
                            ${cvButton}
                            ${actionButtons}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function coverLetterToHtml(text) {
            const raw = String(text || '');
            const idx = raw.indexOf('[Basic Information]');
            if (idx === -1) {
                return `<p class="text-sm text-gray-600 leading-relaxed whitespace-pre-wrap">${esc(raw)}</p>`;
            }

            const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            const basicStart = lines.indexOf('[Basic Information]');
            const coverStart = lines.indexOf('[Cover Letter / Motivation]');
            if (basicStart === -1 || coverStart === -1 || coverStart <= basicStart) {
                return `<p class="text-sm text-gray-600 leading-relaxed whitespace-pre-wrap">${esc(raw)}</p>`;
            }

            const basicLines = lines.slice(basicStart + 1, coverStart);
            const bodyLines = lines.slice(coverStart + 1);
            const pairs = basicLines
                .map(l => {
                    const m = l.match(/^([^:]+):\s*(.*)$/);
                    if (!m) return null;
                    return { k: m[1], v: m[2] };
                })
                .filter(Boolean);

            const basicHtml = pairs.length
                ? `<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    ${pairs.map(p => `
                    <div class="bg-white border border-gray-100 rounded-xl p-3">
                        <p class="text-[10px] text-gray-400 uppercase font-bold">${esc(p.k)}</p>
                        <p class="text-sm text-gray-700 font-medium mt-1">${esc(p.v)}</p>
                    </div>`).join('')}
                </div>`
                : '';

            const body = bodyLines.join('\n').trim();
            const bodyHtml = body
                ? `<div class="mt-4 pt-4 border-t border-gray-100">
                        <p class="text-sm text-gray-600 leading-relaxed whitespace-pre-wrap">${esc(body)}</p>
                   </div>`
                : '';

            return `
                <div>
                    <p class="text-xs text-gray-500 uppercase font-bold tracking-wider">Basic Information</p>
                    <div class="mt-3">${basicHtml}</div>
                    ${bodyHtml}
                </div>
            `;
        }

        function openApplicationDetail(appId) {
            const app = (currentApplications || []).find(a => String(a.id) === String(appId));
            if (!app) {
                showToast('Application not found', 'error');
                return;
            }
            document.getElementById('appDetailTitle').textContent = (app.applicantName || 'Applicant') + ' - Application Detail';
            document.getElementById('appDetailSub').textContent = `Application ID: ${String(app.id)} · Status: ${String(app.status || '')}`;

            const resumeBlock = app.cvFileName ? `
                <div class="space-y-3">
                    <h4 class="text-sm font-bold text-gray-800 flex items-center gap-2">
                        <span class="iconify text-blue-500" data-icon="material-symbols:attach-file"></span>
                        Resume / CV
                    </h4>
                    <div class="bg-gray-50 border border-gray-100 rounded-xl p-4 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <span class="iconify text-red-500 text-2xl" data-icon="mdi:file-pdf-box"></span>
                            <span class="text-sm text-gray-700 font-medium">${esc(app.cvFileName)}</span>
                        </div>
                        <button type="button" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold hover:bg-blue-700 transition-all flex items-center gap-1" onclick="viewCV('${safeJsStr(app.cvFileName)}')">
                            <span class="iconify" data-icon="mdi:open-in-new"></span> Preview
                        </button>
                    </div>
                </div>
            ` : '';

            document.getElementById('appDetailBody').innerHTML = `
                <div class="bg-gray-50 border border-gray-100 rounded-2xl p-5">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <p class="text-[10px] text-gray-400 uppercase font-bold">Applicant</p>
                            <p class="text-sm text-gray-800 font-medium mt-1">${esc(app.applicantName || 'N/A')}</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-gray-400 uppercase font-bold">Email</p>
                            <p class="text-sm text-gray-800 font-medium mt-1">${esc(app.applicantEmail || 'N/A')}</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-gray-400 uppercase font-bold">Student ID</p>
                            <p class="text-sm text-gray-800 font-medium mt-1">${esc(app.applicantStudentId || 'N/A')}</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-gray-400 uppercase font-bold">Priority</p>
                            <p class="text-sm text-gray-800 font-medium mt-1">${app.priority ? 'Priority ' + esc(String(app.priority)) : 'Not set'}</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-gray-400 uppercase font-bold">Submitted</p>
                            <p class="text-sm text-gray-800 font-medium mt-1">${app.createdAt ? formatDateTime(app.createdAt) : 'N/A'}</p>
                        </div>
                    </div>
                </div>
                ${app.coverLetter ? `
                <div class="space-y-3">
                    <h4 class="text-sm font-bold text-gray-800 flex items-center gap-2">
                        <span class="iconify text-blue-500" data-icon="material-symbols:description-outline"></span>
                        Cover Letter
                    </h4>
                    <div class="bg-gray-50 border border-gray-100 rounded-xl p-4">
                        ${coverLetterToHtml(app.coverLetter)}
                    </div>
                </div>
                ` : ''}
                ${resumeBlock}
            `;

            const modal = document.getElementById('appDetailModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeApplicationDetail() {
            const modal = document.getElementById('appDetailModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        async function updateAppStatus(appId, status) {
            try {
                await API.put('/api/applications/' + appId + '/status', { status });
                showToast('Application ' + status.toLowerCase(), 'success');
                const applications = await API.get('/api/jobs/' + jobId + '/applications');
                renderApplicants(applications);
            } catch (err) {
                showToast(err.message || 'Failed to update status', 'error');
            }
        }

        async function toggleStatus(newStatus) {
            try {
                await API.put('/api/jobs/' + jobId, { status: newStatus });
                showToast('Job status updated', 'success');
                const job = await API.get('/api/jobs/' + jobId);
                renderJobInfo(job);
            } catch (err) {
                showToast(err.message || 'Failed to update status', 'error');
            }
        }

        async function deleteJob() {
            if (!confirm('Are you sure you want to delete this job? This action cannot be undone.')) return;
            try {
                await API.del('/api/jobs/' + jobId);
                showToast('Job deleted', 'success');
                setTimeout(() => {
                    window.location.href = currentPortalUser && currentPortalUser.role === 'ADMIN'
                        ? '../admin/job-supervision.html'
                        : 'my-job-list.html';
                }, 800);
            } catch (err) {
                showToast(err.message || 'Failed to delete job', 'error');
            }
        }

        async function viewCV(fileName) {
            try {
                const token = API.getToken();
                const res = await fetch('/api/upload/' + fileName, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('Failed to fetch CV');
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const w = window.open('about:blank', '_blank');
                if (!w) { showToast('Popup was blocked. Please allow popups for preview.', 'warning'); return; }
                w.location.href = url;
            } catch (err) {
                showToast(err.message || 'Failed to open CV', 'error');
            }
        }

        document.getElementById('closeAppDetailBtn').addEventListener('click', closeApplicationDetail);
        document.getElementById('appDetailModal').addEventListener('click', (e) => {
            if (e.target && e.target.id === 'appDetailModal') closeApplicationDetail();
        });
        document.getElementById('moApplicantSort').addEventListener('change', (e) => {
            moApplicantSort = e.target.value;
            renderApplicants(currentApplications);
        });
        document.getElementById('filterPriority1').addEventListener('change', (e) => {
            moPriority1Only = e.target.checked;
            renderApplicants(currentApplications);
        });
        document.getElementById('filterPendingOnly').addEventListener('change', (e) => {
            moPendingOnly = e.target.checked;
            renderApplicants(currentApplications);
        });
    </script>
</body>
</html>
