<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - MO Recruitment System (MO)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<style>
        body {
            background: linear-gradient(135deg, #EBF4FF 0%, #F5F7FA 100%);
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .login-card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .tab-active { color: #2563EB; border-bottom: 2px solid #2563EB; font-weight: 600; }
        .tab-inactive { color: #9CA3AF; border-bottom: 2px solid transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center py-12 px-4">
<div class="w-full max-w-md">
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center p-3 bg-blue-600 rounded-2xl shadow-lg mb-6">
<span class="iconify text-white text-4xl" data-icon="mdi:school"></span>
</div>
<h1 class="text-2xl font-bold text-gray-800 tracking-tight">
                MO Recruitment System<br/>
<span class="text-blue-600">MO Portal</span>
</h1>
<p class="text-gray-500 mt-2 text-sm uppercase tracking-widest">Management Office</p>
</div>
<div class="bg-white p-8 rounded-2xl login-card border border-blue-50">
<div class="flex mb-6 border-b border-gray-100">
<button class="flex-1 pb-3 text-sm tab-active" id="tabLogin" onclick="switchTab('login')">Login</button>
<button class="flex-1 pb-3 text-sm tab-inactive" id="tabRegister" onclick="switchTab('register')">Register</button>
</div>
<div class="hidden mb-4 p-3 rounded-lg text-sm flex items-center gap-2" id="alertBox">
<span class="iconify" data-icon="" id="alertIcon"></span>
<span id="alertMsg"></span>
</div>

<form class="space-y-6" id="loginForm">
<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">MO Account / Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
<span class="iconify" data-icon="mdi:account-outline"></span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none placeholder-gray-300 text-gray-600" id="username" placeholder="Enter MO account" type="text"/>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-2">
<label class="block text-sm font-semibold text-gray-700">Password</label>
<a class="text-xs text-gray-400 hover:text-blue-600 transition-colors" href="/TA/forgot-password.html">Forgot password?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
<span class="iconify" data-icon="mdi:lock-outline"></span>
</span>
<input class="block w-full pl-10 pr-12 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none placeholder-gray-300 text-gray-600" id="password" placeholder="Enter your password" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-blue-500" onclick="togglePassword()" type="button">
<span class="iconify" data-icon="mdi:eye-off-outline" id="passIcon"></span>
</button>
</div>
</div>
<button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md shadow-blue-200 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
<span id="btnText">Login</span>
<span class="hidden animate-spin iconify" data-icon="mdi:loading" id="loadingIcon"></span>
</button>
</form>

<form class="space-y-5 hidden" id="registerForm">
<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
<span class="iconify" data-icon="mdi:account-outline"></span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none placeholder-gray-300 text-gray-600" id="regFullName" placeholder="Your full name" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
<span class="iconify" data-icon="mdi:email-outline"></span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none placeholder-gray-300 text-gray-600" id="regEmail" placeholder="your@email.com" type="email"/>
</div>
</div>
<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
<span class="iconify" data-icon="mdi:account-circle-outline"></span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none placeholder-gray-300 text-gray-600" id="regUsername" placeholder="Choose a username" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
<span class="iconify" data-icon="mdi:lock-outline"></span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none placeholder-gray-300 text-gray-600" id="regPassword" placeholder="Min 6 characters" type="password"/>
</div>
</div>
<button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md shadow-blue-200 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
<span id="regBtnText">Create Account</span>
<span class="hidden animate-spin iconify" data-icon="mdi:loading" id="regLoadingIcon"></span>
</button>
</form>

<div class="mt-8 pt-6 border-t border-gray-100 flex items-center justify-center gap-4">
<span class="text-xs text-gray-400">Other methods:</span>
<button class="text-gray-400 hover:text-green-500 transition-colors" type="button">
<span class="iconify text-xl" data-icon="mdi:wechat"></span>
</button>
<button class="text-gray-400 hover:text-blue-400 transition-colors" type="button">
<span class="iconify text-xl" data-icon="mdi:qqchat"></span>
</button>
</div>
</div>
</div>
<div class="mt-8 text-center">
<p class="text-gray-400 text-xs">&copy; 2026 MO Recruitment System</p>
</div>
<script src="/js/api.js"></script>
<script>
        (function() {
            const token = API.getToken();
            const user = API.getUser();
            if (token && user) {
                if (user.role === 'MO') window.location.href = '/MO/my-job-list.html';
                else if (user.role === 'ADMIN') window.location.href = '/admin/admin-dashboard.html';
            }
        })();

        const alertBox = document.getElementById('alertBox');
        const alertMsg = document.getElementById('alertMsg');
        const alertIcon = document.getElementById('alertIcon');

        function showAlert(type, message) {
            alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'bg-green-50', 'text-green-700');
            if (type === 'error') {
                alertBox.classList.add('bg-red-50', 'text-red-700');
                alertIcon.setAttribute('data-icon', 'mdi:alert-circle-outline');
            } else {
                alertBox.classList.add('bg-green-50', 'text-green-700');
                alertIcon.setAttribute('data-icon', 'mdi:check-circle-outline');
            }
            alertMsg.innerText = message;
        }

        function togglePassword() {
            const passInput = document.getElementById('password');
            const passIcon = document.getElementById('passIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                passIcon.setAttribute('data-icon', 'mdi:eye-outline');
            } else {
                passInput.type = 'password';
                passIcon.setAttribute('data-icon', 'mdi:eye-off-outline');
            }
        }

        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            alertBox.classList.add('hidden');
            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.className = 'flex-1 pb-3 text-sm tab-active';
                tabRegister.className = 'flex-1 pb-3 text-sm tab-inactive';
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabLogin.className = 'flex-1 pb-3 text-sm tab-inactive';
                tabRegister.className = 'flex-1 pb-3 text-sm tab-active';
            }
        }

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!username || !password) {
                showAlert('error', 'Please enter your account and password');
                return;
            }
            const btnText = document.getElementById('btnText');
            const loadingIcon = document.getElementById('loadingIcon');
            btnText.innerText = 'Verifying...';
            loadingIcon.classList.remove('hidden');
            try {
                const res = await API.post('/api/auth/login', { username, password });
                API.setAuth(res.token, res.user);
                showAlert('success', 'Login successful. Redirecting...');
                setTimeout(() => {
                    if (res.user.role === 'MO') window.location.href = '/MO/my-job-list.html';
                    else if (res.user.role === 'ADMIN') window.location.href = '/admin/admin-dashboard.html';
                    else {
                        showAlert('error', 'Please use TA login page');
                        API.clearAuth();
                        btnText.innerText = 'Login';
                        loadingIcon.classList.add('hidden');
                    }
                }, 600);
            } catch (err) {
                showAlert('error', err.message || 'Invalid account or password');
                btnText.innerText = 'Login';
                loadingIcon.classList.add('hidden');
            }
        };

        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            if (!fullName || !email || !username || !password) {
                showAlert('error', 'Please fill in all fields');
                return;
            }
            const btn = document.getElementById('regBtnText');
            const icon = document.getElementById('regLoadingIcon');
            btn.innerText = 'Creating...';
            icon.classList.remove('hidden');
            try {
                const res = await API.post('/api/auth/register', { username, password, role: 'MO', fullName, email });
                API.setAuth(res.token, res.user);
                showAlert('success', 'Account created! Redirecting...');
                setTimeout(() => { window.location.href = '/MO/my-job-list.html'; }, 600);
            } catch (err) {
                showAlert('error', err.message || 'Registration failed');
                btn.innerText = 'Create Account';
                icon.classList.add('hidden');
            }
        };
    </script>
</body>
</html>
