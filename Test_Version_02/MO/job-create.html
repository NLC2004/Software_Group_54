<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Post New Job - TA Recruitment MO System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8F9FC; }
        .nav-link { display: flex; align-items: center; padding: 0.75rem; border-radius: 0.75rem; transition: all 0.3s ease; }
        .nav-link.active { background-color: rgb(239 246 255); color: rgb(37 99 235); font-weight: 600; }
        .nav-link.inactive { color: rgb(100 116 139); }
        .nav-link.inactive:hover { background-color: rgb(248 250 252); color: rgb(37 99 235); }
        .form-input { display: block; width: 100%; background-color: white; border: 1px solid rgb(229 231 235); border-radius: 1rem; padding: 0.75rem 1rem; transition: all 0.3s ease; outline: none; }
        .form-input:focus { border-color: rgb(59 130 246); box-shadow: 0 0 0 3px rgba(59 130 246, 0.1); }
        .glass-effect { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="flex min-h-screen">
<!-- Sidebar -->
<aside class="w-64 bg-white border-r border-gray-100 flex flex-col fixed h-full z-50">
<div class="p-6 flex items-center space-x-3">
<div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white">
<span class="iconify text-2xl" data-icon="solar:library-bold"></span>
</div>
<span class="text-xl font-bold text-gray-800 tracking-tight">EduMO</span>
</div>
<nav class="flex-1 mt-4 px-4 space-y-2">
<a class="nav-link inactive" href="my-job-list.html">
<span class="iconify mr-3 text-xl" data-icon="solar:widget-4-bold"></span>
<span>Dashboard</span>
</a>
<a class="nav-link inactive" href="statistics-analysis.html">
<span class="iconify mr-3 text-xl" data-icon="solar:chart-2-bold"></span>
<span>Statistics</span>
</a>
<a class="nav-link inactive" href="notifications-messages.html">
<span class="iconify mr-3 text-xl" data-icon="solar:bell-bing-bold"></span>
<span>Notifications</span>
</a>
<a class="nav-link inactive" href="personal-center.html">
<span class="iconify mr-3 text-xl" data-icon="solar:user-circle-bold"></span>
<span>Profile Settings</span>
</a>
</nav>
<div class="p-4 border-t border-gray-100 mt-auto">
<div class="bg-gray-50 p-4 rounded-xl flex items-center gap-3">
<img alt="Avatar" class="w-10 h-10 rounded-full border border-gray-200 object-cover" src="https://modao.cc/agent-py/media/generated_images/2026-03-21/bc2fcb312e504b8ca61689559e7c92b5.jpg"/>
<div class="flex-1 overflow-hidden min-w-0">
<p class="text-sm font-bold text-gray-800 truncate" data-user-name>MO User</p>
<p class="text-[10px] text-gray-400 truncate" data-user-role>Management Office</p>
</div>
<a class="text-gray-400 hover:text-red-500 shrink-0 cursor-pointer" id="logoutBtn" title="Logout">
<span class="iconify text-lg" data-icon="mdi:logout"></span>
</a>
</div>
<a class="mt-3 hidden w-full items-center justify-center px-3 py-2 rounded-xl border border-gray-200 bg-white text-gray-700 text-sm font-semibold hover:bg-gray-50 transition-all" href="../admin/job-supervision.html" id="backToAdminBtn">
<span class="iconify mr-2 text-base" data-icon="solar:arrow-left-linear"></span>
Back to Admin
</a>
</div>
</aside>
<!-- Main Content -->
<main class="ml-64 flex-1 flex flex-col">
<header class="h-16 bg-white/80 glass-effect border-b border-gray-100 flex items-center px-8">
<div class="flex items-center space-x-2 text-sm text-gray-500">
<a class="hover:text-blue-600" href="my-job-list.html">Jobs</a>
<span class="iconify" data-icon="solar:alt-arrow-right-linear"></span>
<span class="text-gray-900 font-medium">Create New Job</span>
</div>
</header>
<div class="p-8 max-w-4xl mx-auto w-full">
<div class="mb-10">
<h1 class="text-3xl font-black text-gray-800 mb-2">Create New TA Position</h1>
<p class="text-gray-400">Fill in the details below to start recruiting qualified student assistants.</p>
</div>
<form class="space-y-8 pb-20" id="createJobForm">
<!-- Section 1: Basic Info -->
<section class="bg-white p-8 rounded-[2rem] shadow-sm border border-gray-100">
<div class="flex items-center mb-6 space-x-3">
<div class="p-2 bg-blue-50 text-blue-600 rounded-lg"><span class="iconify text-xl" data-icon="solar:info-square-bold"></span></div>
<h3 class="text-lg font-bold text-gray-800">Basic Information</h3>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="text-sm font-semibold text-gray-600 ml-1">Job Title *</label>
<input class="form-input" id="jobTitle" placeholder="e.g. Python Lab Teaching Assistant" type="text" required/>
</div>
<div class="space-y-2">
<label class="text-sm font-semibold text-gray-600 ml-1">Course Name</label>
<input class="form-input" id="courseName" placeholder="e.g. Advanced Machine Learning" type="text"/>
</div>
<div class="space-y-2">
<label class="text-sm font-semibold text-gray-600 ml-1">Deadline for Application</label>
<input class="form-input" id="deadline" type="date" autocomplete="off" placeholder="YYYY-MM-DD"/>
</div>
<div class="space-y-2">
<label class="text-sm font-semibold text-gray-600 ml-1">Quota (number of positions)</label>
<input class="form-input" id="quota" type="number" min="1" placeholder="e.g. 3"/>
</div>
<div class="space-y-2">
<label class="text-sm font-semibold text-gray-600 ml-1">Weekly Hours</label>
<input class="form-input" id="weeklyHours" type="number" min="1" placeholder="e.g. 10"/>
</div>
<div class="md:col-span-2 space-y-2">
<label class="text-sm font-semibold text-gray-600 ml-1">Schedule</label>
<input class="form-input" id="schedule" placeholder="e.g. Tue/Thu 14:00-16:00" type="text"/>
</div>
</div>
</section>
<!-- Section 2: Requirements -->
<section class="bg-white p-8 rounded-[2rem] shadow-sm border border-gray-100">
<div class="flex items-center mb-6 space-x-3">
<div class="p-2 bg-purple-50 text-purple-600 rounded-lg"><span class="iconify text-xl" data-icon="solar:diploma-bold"></span></div>
<h3 class="text-lg font-bold text-gray-800">Requirements &amp; Description</h3>
</div>
<div class="space-y-6">
<div class="space-y-2">
<label class="text-sm font-semibold text-gray-600 ml-1">Job Description</label>
<textarea class="form-input" id="description" placeholder="Describe the responsibilities and tasks..." rows="4"></textarea>
</div>
<div class="space-y-2">
<label class="text-sm font-semibold text-gray-600 ml-1">Requirements (press Enter to add)</label>
<div class="flex items-center gap-2 mb-2">
<input class="form-input flex-1" id="reqInput" placeholder="e.g. GPA >= 3.5" type="text"/>
<button type="button" onclick="addRequirement()" class="px-4 py-3 bg-blue-600 text-white rounded-xl text-sm font-semibold hover:bg-blue-700">Add</button>
</div>
<div class="flex flex-wrap gap-2" id="reqTags"></div>
</div>
</div>
</section>
<div class="flex items-center justify-end space-x-4">
<a href="my-job-list.html" class="px-8 py-3 rounded-2xl font-bold text-gray-400 hover:bg-gray-100 transition-all">Cancel</a>
<button type="submit" class="px-10 py-3 bg-blue-600 text-white rounded-2xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 hover:-translate-y-1 transition-all" id="publishBtn">Publish Now</button>
</div>
</form>
</div>
</main>
<script src="/js/api.js"></script>
<script>
        const user = requireAuth(['MO', 'ADMIN']);
        if (user) {
            updateSidebarUser(user);
            document.getElementById('logoutBtn').onclick = () => logout();
            if (user.role === 'ADMIN') {
                const backBtn = document.getElementById('backToAdminBtn');
                if (backBtn) {
                    backBtn.classList.remove('hidden');
                    backBtn.classList.add('flex');
                }
            }
        }

        const requirements = [];

        function deadlineMustBeAfterNow(dateStr) {
            const t = String(dateStr || '').trim();
            if (!t) return { ok: true };
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t);
            if (!m) return { ok: false, message: 'Please select a valid deadline date.' };
            const y = +m[1], mo = +m[2], d = +m[3];
            const endOfDay = new Date(y, mo - 1, d, 23, 59, 59, 999);
            const now = new Date();
            if (!(endOfDay.getFullYear() === y && endOfDay.getMonth() === mo - 1 && endOfDay.getDate() === d)) {
                return { ok: false, message: 'Invalid deadline date.' };
            }
            if (endOfDay <= now) {
                return { ok: false, message: 'Deadline must be after the current time.' };
            }
            return { ok: true };
        }

        function parseDeadlineField(raw) {
            const t = String(raw || '').trim();
            if (!t) return { ok: true, value: null };
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t);
            if (!m) return { ok: false, message: 'Please enter deadline as YYYY-MM-DD (e.g. 2026-04-05).' };
            const y = +m[1], mo = +m[2], d = +m[3];
            const dt = new Date(y, mo - 1, d);
            if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) {
                return { ok: false, message: 'Invalid deadline date.' };
            }
            return { ok: true, value: t };
        }

        document.getElementById('reqInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); addRequirement(); }
        });

        function addRequirement() {
            const input = document.getElementById('reqInput');
            const val = input.value.trim();
            if (!val) return;
            requirements.push(val);
            input.value = '';
            renderReqTags();
        }

        function removeRequirement(idx) {
            requirements.splice(idx, 1);
            renderReqTags();
        }

        function renderReqTags() {
            const container = document.getElementById('reqTags');
            container.innerHTML = requirements.map((r, i) =>
                `<span class="bg-gray-100 px-3 py-1 rounded-full text-xs font-medium text-gray-600 flex items-center">${esc(r)} <span class="ml-2 cursor-pointer text-gray-400 hover:text-red-500" onclick="removeRequirement(${i})">&times;</span></span>`
            ).join('');
        }

        document.getElementById('createJobForm').onsubmit = async (e) => {
            e.preventDefault();
            const title = document.getElementById('jobTitle').value.trim();
            if (!title) { showToast('Please enter a job title', 'warning'); return; }

            const dl = parseDeadlineField(document.getElementById('deadline').value);
            if (!dl.ok) { showToast(dl.message, 'warning'); return; }

            const dlAfterNow = deadlineMustBeAfterNow(dl.value);
            if (!dlAfterNow.ok) { showToast(dlAfterNow.message, 'warning'); return; }

            const btn = document.getElementById('publishBtn');
            btn.disabled = true;
            btn.textContent = 'Publishing...';

            const body = {
                title,
                type: 'TA',
                courseName: document.getElementById('courseName').value.trim(),
                description: document.getElementById('description').value.trim(),
                requirements: requirements,
                quota: parseInt(document.getElementById('quota').value) || 1,
                weeklyHours: parseFloat(document.getElementById('weeklyHours').value) || 0,
                schedule: document.getElementById('schedule').value.trim(),
                deadline: dl.value
            };

            try {
                await API.post('/api/jobs', body);
                showToast('Job posted successfully!', 'success');
                setTimeout(() => { window.location.href = 'my-job-list.html'; }, 800);
            } catch (err) {
                showToast(err.message || 'Failed to create job', 'error');
                btn.disabled = false;
                btn.textContent = 'Publish Now';
            }
        };
    </script>
</body>
</html>
