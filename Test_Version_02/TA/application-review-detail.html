<p class="px-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Management</p>

<span class="iconify text-lg" data-icon="mdi:logout"></span>
</button>

<nav class="flex items-center text-sm text-gray-500 mb-6">
<a class="hover:text-blue-600" href="dashboard.html">Home</a>
<span class="mx-2">/</span>
<a class="hover:text-blue-600" href="my-ta-applications.html">My Applications</a>

<div class="max-w-4xl" id="detailContent">

</div>

</div>
<div class="modal" id="withdraw-modal">
<div class="bg-white rounded-2xl p-6 w-[320px] shadow-2xl">
<div class="w-12 h-12 bg-red-50 rounded-full flex items-center justify-center mb-4">

</div>
<h3 class="text-lg font-bold text-gray-900 mb-2">Withdraw?</h3>
<p class="text-sm text-gray-500 mb-6">Are you sure you want to withdraw your application? This action cannot be undone.</p>
<div class="flex gap-3">
<button class="flex-1 py-3 bg-gray-100 text-gray-600 rounded-xl font-bold" onclick="closeWithdrawModal()">Cancel</button>
<button class="flex-1 py-3 bg-red-600 text-white rounded-xl font-bold" id="confirmWithdrawBtn">Confirm</button>
</div>
</div>
</div>
<script src="/js/api.js"></script>
<script>
    let appId = null;
    const MATCH_MODELS = ['deepseek-r1', 'gemini-2.5-pro', 'qwen-plus', 'gpt-5-mini'];
    let selectedModel = MATCH_MODELS[0];
    let currentMatch = null;

    function renderThinkingTrace(items) {
        const arr = Array.isArray(items) ? items.filter(Boolean) : [];
        if (!arr.length) return '<p class="text-sm text-gray-400">No reasoning summary provided.</p>';
        return `<div class="space-y-2">${arr.map((x, i) => `<div class="bg-white border border-gray-100 rounded-lg px-3 py-2 text-sm text-gray-700">${i + 1}. ${esc(x)}</div>`).join('')}</div>`;
    }

    function renderMatchCard(match) {
        const score = Number(match?.score || 0);
        const label = match?.label || 'Needs review';
        const recommendation = match?.recommendation || 'Needs manual review';
        const requiredSkills = Array.isArray(match?.requiredSkills) ? match.requiredSkills : [];
        const matchedSkills = Array.isArray(match?.matchedSkills) ? match.matchedSkills : [];
        const missingSkills = Array.isArray(match?.missingSkills) ? match.missingSkills : [];
        const cot = Array.isArray(match?.cot) ? match.cot : [];
        return `
            <div class="bg-[#F8FAFF] rounded-2xl border border-blue-100 shadow-sm p-6 space-y-5">
                <div class="flex items-start justify-between gap-4">
                    <div class="flex items-start gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-100">
                            <span class="iconify text-white text-2xl" data-icon="mdi:sparkles"></span>
                        </div>
                        <div>
                            <h3 class="text-2xl font-bold text-gray-900">${esc(label)}</h3>
                            <p class="text-sm text-gray-500 mt-1">${esc(recommendation)}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-4xl font-black text-orange-500 leading-none">${score}%</div>
                        <div class="text-xs text-gray-400 font-bold tracking-widest mt-1">MATCH</div>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-white rounded-2xl border border-gray-100 p-4 min-h-[140px]">
                        <p class="text-xs font-black tracking-widest text-gray-400 uppercase">Matched Skills</p>
                        <div class="mt-3 flex flex-wrap gap-2">${matchedSkills.length ? matchedSkills.map(s => `<span class="px-3 py-1 rounded-full bg-green-50 text-green-700 border border-green-100 text-sm font-semibold">${esc(s)}</span>`).join('') : '<span class="text-gray-400 text-sm">None detected</span>'}</div>
                    </div>
                    <div class="bg-white rounded-2xl border border-gray-100 p-4 min-h-[140px]">
                        <p class="text-xs font-black tracking-widest text-gray-400 uppercase">Missing Skills</p>
                        <div class="mt-3 flex flex-wrap gap-2">${missingSkills.length ? missingSkills.map(s => `<span class="px-3 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-100 text-sm font-semibold">${esc(s)}</span>`).join('') : '<span class="text-gray-400 text-sm">None</span>'}</div>
                    </div>
                </div>
                <div class="bg-white rounded-2xl border border-gray-100 p-4">
                    <div class="flex items-center justify-between mb-3">
                        <p class="text-xs font-black tracking-widest text-gray-400 uppercase">Reasoning Summary</p>
                        <span class="text-[10px] px-2 py-1 rounded-full bg-blue-50 text-blue-600 font-bold">Scroll</span>
                    </div>
                    <div class="max-h-40 overflow-y-auto pr-2 space-y-2 scrollbar-thin scrollbar-thumb-gray-300 scrollbar-track-gray-100">
                        ${renderThinkingTrace(cot)}
                    </div>
                </div>
                <div class="text-sm text-gray-600 leading-relaxed bg-gray-50 rounded-xl p-4">
                    ${esc(match?.explanation || '')}
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs text-gray-500">
                    <div class="bg-white border border-gray-100 rounded-xl p-3">Current peak hours: <span class="font-bold text-gray-800">${Number(match?.currentPeakWeeklyHours || 0).toFixed(1)}h</span></div>
                    <div class="bg-white border border-gray-100 rounded-xl p-3">Projected peak hours: <span class="font-bold text-gray-800">${Number(match?.projectedPeakWeeklyHours || 0).toFixed(1)}h</span></div>
                    <div class="bg-white border border-gray-100 rounded-xl p-3">Workload risk: <span class="font-bold text-gray-800">${esc(match?.workloadRisk || 'LOW')}</span></div>
                </div>
                <div class="text-xs text-gray-400 uppercase tracking-widest font-bold">Required skills: ${requiredSkills.length ? requiredSkills.map(esc).join(', ') : 'None detected'}</div>
            </div>
        `;
    }

    async function loadMatch() {
        if (!appId) return;
        const mount = document.getElementById('matchMount');
        if (!mount) return;
        mount.innerHTML = '<div class="text-gray-400 text-sm">Calling API...</div>';
        try {
            const result = await API.post('/api/jobs/' + currentJobId + '/match', { applicationId: appId, model: selectedModel });
            currentMatch = result;
            mount.innerHTML = renderMatchCard(result);
        } catch (err) {
            mount.innerHTML = '<div class="text-red-500 text-sm">API call failed, please try again.</div>';
            showToast(err.message || 'Match API failed', 'error');
        }
    }

    function coverLetterToHtml(text) {
        const raw = String(text || '');
        const idx = raw.indexOf('[Basic Information]');
        if (idx === -1) {
            return `<p class="text-sm text-gray-600 leading-relaxed whitespace-pre-wrap">${esc(raw)}</p>`;
        }

        const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        const basicStart = lines.indexOf('[Basic Information]');
        const coverStart = lines.indexOf('[Cover Letter / Motivation]');
        if (basicStart === -1 || coverStart === -1 || coverStart <= basicStart) {
            return `<p class="text-sm text-gray-600 leading-relaxed whitespace-pre-wrap">${esc(raw)}</p>`;
        }

        const basicLines = lines.slice(basicStart + 1, coverStart);
        const bodyLines = lines.slice(coverStart + 1);
        const pairs = basicLines
            .map(l => {
                const m = l.match(/^([^:]+):\s*(.*)$/);
                if (!m) return null;
                return { k: m[1], v: m[2] };
            })
            .filter(Boolean);

        const basicHtml = pairs.length
            ? `<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                ${pairs.map(p => `
                <div class="bg-white border border-gray-100 rounded-xl p-3">
                    <p class="text-[10px] text-gray-400 uppercase font-bold">${esc(p.k)}</p>
                    <p class="text-sm text-gray-700 font-medium mt-1">${esc(p.v)}</p>
                </div>`).join('')}
            </div>`
            : '';

        const body = bodyLines.join('\n').trim();
        const bodyHtml = body
            ? `<div class="mt-4 pt-4 border-t border-gray-100">
                    <p class="text-sm text-gray-600 leading-relaxed whitespace-pre-wrap">${esc(body)}</p>
               </div>`
            : '';

        return `
            <div>
                <p class="text-xs text-gray-500 uppercase font-bold tracking-wider">Basic Information</p>
                <div class="mt-3">${basicHtml}</div>
                ${bodyHtml}
            </div>
        `;
    }

    async function previewPdf(fileName) {
        const w = window.open('about:blank', '_blank');
        if (!w) { showToast('Popup was blocked. Please allow popups for preview.', 'warning'); return; }
        try {
            w.document.open();
            w.document.write(`<!doctype html><html><head><meta charset="utf-8"/><title>${esc(fileName)}</title><style>html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#f8fafc;} .wrap{height:100%;display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:14px;} iframe{width:100%;height:100%;border:0;}</style></head><body><div class="wrap">Loading preview...</div></body></html>`);
            w.document.close();
            const resp = await fetch('/api/upload/' + encodeURIComponent(fileName), {
                headers: { 'Authorization': 'Bearer ' + API.getToken() }
            });
            if (!resp.ok) throw new Error('Failed to load PDF');
            const blob = await resp.blob();
            const url = URL.createObjectURL(blob);
            w.document.open();
            w.document.write(`<!doctype html><html><head><meta charset="utf-8"/><title>${esc(fileName)}</title><style>html,body{height:100%;margin:0;} iframe{width:100%;height:100%;border:0;}</style></head><body><iframe src="${url}"></iframe></body></html>`);
            w.document.close();
        } catch (err) {
            try { w.close(); } catch (_) {}
            showToast(err.message || 'Preview failed', 'error');
        }
    }

    function openWithdrawModal() {
        document.getElementById('withdraw-modal').classList.add('active');
    }
    function closeWithdrawModal() {
        document.getElementById('withdraw-modal').classList.remove('active');
    }

    (async function init() {
        const user = requireAuth(['TA']);
        if (!user) return;
        updateSidebarUser(user);

        appId = getUrlParam('id');
        if (!appId) {
            document.getElementById('detailContent').innerHTML = '<div class="text-center text-red-500 py-16">No application ID specified.</div>';
            return;
        }

        try {
            const app = await API.get('/api/applications/' + appId);
            const statusColors = { PENDING: 'blue', APPROVED: 'green', REJECTED: 'red', WITHDRAWN: 'gray' };
            const c = statusColors[app.status] || 'gray';

            document.getElementById('detailContent').innerHTML = `
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                <div class="p-6 border-b border-gray-100 flex items-center gap-3">
                    <a class="p-2 hover:bg-gray-50 rounded-xl transition-colors text-gray-500 border border-gray-100" href="my-ta-applications.html" title="Back">
                        <span class="iconify text-xl" data-icon="mdi:arrow-left"></span>
                    </a>
                    <div>
                        <h2 class="text-xl font-bold text-gray-900 leading-tight">Review result - ${esc(app.jobTitle || 'Application')}</h2>
                        <p class="text-xs text-gray-400 mt-1">Application ID: ${esc(String(app.id))}</p>
                    </div>
                </div>
                <div class="p-6 space-y-6">
                    <div class="bg-white border border-gray-100 rounded-2xl p-5 shadow-sm space-y-4">
                        <div class="flex justify-between items-center">
                            <span class="text-xs text-gray-500 uppercase font-bold tracking-wider">Status</span>
                            ${statusBadge(app.status)}
                        </div>
                        <div class="grid grid-cols-2 gap-y-4 pt-4 border-t border-gray-50">
                            <div>
                                <p class="text-[10px] text-gray-400 uppercase font-bold">Position</p>
                                <p class="text-sm font-medium text-gray-800">${esc(app.jobTitle || 'N/A')}</p>
                            </div>
                            <div>
                                <p class="text-[10px] text-gray-400 uppercase font-bold">Submission Time</p>
                                <p class="text-sm font-medium text-gray-800">${app.createdAt ? formatDateTime(app.createdAt) : 'N/A'}</p>
                            </div>
                            ${app.jobType ? `<div>
                                <p class="text-[10px] text-gray-400 uppercase font-bold">Type</p>
                                <p class="text-sm font-medium text-gray-800">${esc(app.jobType)}</p>
                            </div>` : ''}
                            ${app.updatedAt ? `<div>
                                <p class="text-[10px] text-gray-400 uppercase font-bold">Last Updated</p>
                                <p class="text-sm font-medium text-gray-800">${formatDateTime(app.updatedAt)}</p>
                            </div>` : ''}
                        </div>
                    </div>
                    ${app.coverLetter ? `<div class="space-y-3">
                        <h3 class="text-sm font-bold text-gray-800 flex items-center gap-2">
                            <span class="iconify text-blue-500" data-icon="material-symbols:description-outline"></span>
                            Cover Letter
                        </h3>
                        <div class="bg-gray-50 border border-gray-100 rounded-xl p-4">
                            ${coverLetterToHtml(app.coverLetter)}
                        </div>
                    </div>` : ''}
                    ${app.cvFileName ? `<div class="space-y-3">
                        <h3 class="text-sm font-bold text-gray-800 flex items-center gap-2">
                            <span class="iconify text-blue-500" data-icon="material-symbols:attach-file"></span>
                            Resume / CV
                        </h3>
                        <div class="bg-gray-50 border border-gray-100 rounded-xl p-4 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <span class="iconify text-red-500 text-2xl" data-icon="mdi:file-pdf-box"></span>
                                <span class="text-sm text-gray-700 font-medium">${esc(app.cvFileName)}</span>
                            </div>
                            <button type="button"
                               class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold hover:bg-blue-700 transition-all flex items-center gap-1"
                               onclick="previewPdf('${esc(String(app.cvFileName)).replace(/'/g, "\\'")}')">
                                <span class="iconify" data-icon="mdi:open-in-new"></span> Preview
                            </button>
                        </div>
                    </div>` : ''}
                    ${app.status === 'PENDING' ? `<div class="pt-2">
                        <button class="w-full py-4 bg-red-50 text-red-600 border border-red-100 rounded-xl font-bold flex items-center justify-center gap-2" onclick="openWithdrawModal()">
                            <span class="iconify" data-icon="material-symbols:cancel-presentation-outline-rounded"></span>
                            Withdraw Application
                        </button>
                    </div>` : ''}
                </div>
            </div>`;
        } catch (err) {
            document.getElementById('detailContent').innerHTML = '<div class="text-center text-red-500 py-16">Failed to load application details.</div>';
            showToast(err.message || 'Failed to load application', 'error');
        }
    })();

    document.getElementById('confirmWithdrawBtn').addEventListener('click', async () => {
        try {
            await API.put('/api/applications/' + appId + '/status', { status: 'WITHDRAWN' });
            showToast('Application withdrawn successfully.', 'success');
            closeWithdrawModal();
            setTimeout(() => { window.location.href = 'my-ta-applications.html'; }, 600);
        } catch (err) {
            showToast(err.message || 'Failed to withdraw application', 'error');
            closeWithdrawModal();
        }
    });
</script>
</body>
