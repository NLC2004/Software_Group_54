<!DOCTYPE html>

<html lang="en">

        .req-check { width: 20px; height: 20px; flex: 0 0 20px; margin-top: 2px; }

<nav class="flex-1 px-4 space-y-1 overflow-y-auto">
<a class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:bg-gray-50 hover:text-blue-600 rounded-xl transition-all" href="dashboard.html">
<span class="iconify text-xl" data-icon="mdi:view-dashboard"></span>
                Dashboard
            </a>
<a class="flex items-center gap-3 px-4 py-3 text-blue-600 bg-blue-50 rounded-xl font-medium transition-all" href="ta-recruitment-list.html">
<span class="iconify text-xl" data-icon="mdi:account-group"></span>
                TA Recruitment
            </a>
<a class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:bg-gray-50 hover:text-blue-600 rounded-xl transition-all" href="my-ta-applications.html">
<span class="iconify text-xl" data-icon="mdi:clipboard-text-clock-outline"></span>
                My Applications
            </a>
<a class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:bg-gray-50 hover:text-blue-600 rounded-xl transition-all" href="personal-information.html">
<span class="iconify text-xl" data-icon="mdi:account-circle-outline"></span>
                Profile
            </a>
<div class="pt-4 border-t border-gray-100 mt-4">
<p class="px-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Management</p>
<a class="w-full flex items-center gap-3 px-4 py-3 text-gray-500 hover:bg-gray-50 hover:text-blue-600 rounded-xl transition-all" href="notifications.html">

                    Notifications
                </a>
</div>

<div class="bg-gray-50 p-4 rounded-xl flex items-center gap-3">
<img alt="Avatar" class="w-10 h-10 rounded-full border border-gray-200" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix"/>

<p class="text-sm font-bold truncate" data-user-name>--</p>
<p class="text-[10px] text-gray-400 truncate" data-user-role>--</p>
</div>
<button class="text-gray-400 hover:text-red-500" title="Logout" onclick="logout()">
<span class="iconify text-lg" data-icon="mdi:logout"></span>
</button>
</div>

<main class="flex-1 ml-64 p-8">
<nav class="flex items-center text-sm text-gray-500 mb-6">
<a class="hover:text-blue-600" href="dashboard.html">Home</a>
<span class="mx-2">/</span>
<a class="hover:text-blue-600" href="ta-recruitment-list.html">TA Recruitment</a>
<span class="mx-2">/</span>
<span class="text-gray-900 font-medium">Detail</span>
</nav>
<div class="max-w-4xl" id="jobContent">
<div class="text-center text-gray-400 py-16">Loading position details...</div>
</div>
</main>
</div>
<script src="/js/api.js"></script>
<script>
(function(){
    function formatJobType(t) {
        const raw = String(t || '').trim();
        const tv = raw === 'COURSE' ? 'COURSE_TA' : (raw === 'ACTIVITY' ? 'CLASS_TEST_TA' : raw);
        const map = {
            COURSE_TA: 'Course TA',
            LAB_TA: 'Lab TA',
            FINAL_EXAM_TA: 'Final Exam TA',
            CLASS_TEST_TA: 'Class Test TA'
        };
        return map[tv] || tv || '';
    }

    function parseDeadline(deadline) {
        if (!deadline) return null;
        const raw = String(deadline).trim();
        if (!raw) return null;
        const normalized = raw.replace(/\//g, '-');
        const pureDateMatch = normalized.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
        if (pureDateMatch) {
            const [, year, month, day] = pureDateMatch;
            return new Date(Number(year), Number(month) - 1, Number(day), 23, 59, 59, 999).getTime();
        }
        let ts = Date.parse(raw);
        if (!Number.isNaN(ts)) return ts;
        ts = Date.parse(normalized);
        return Number.isNaN(ts) ? null : ts;
    }

    function isRecruitmentExpired(job) {
        if (!job) return true;
        if (job.status && String(job.status).toUpperCase() !== 'OPEN') return true;
        const ts = parseDeadline(job.deadline);
        if (ts == null) return false;
        return Date.now() > ts;
    }

    window.__ta_parseDeadline = parseDeadline;
    window.__ta_isRecruitmentExpired = isRecruitmentExpired;
    window.__ta_formatJobType = formatJobType;
})();

(async function init() {
    const user = requireAuth(['TA']);
    if (!user) return;
    updateSidebarUser(user);

    const jobId = getUrlParam('id');
    if (!jobId) {
        document.getElementById('jobContent').innerHTML = '<div class="text-center text-red-500 py-16">No position ID specified.</div>';
        return;
    }

    try {
        const [job, myApplications] = await Promise.all([
            API.get('/api/jobs/' + jobId),
            API.get('/api/applications')
        ]);
        const deadline = job.deadline ? formatDate(job.deadline) : 'N/A';
        const expired = window.__ta_isRecruitmentExpired(job);
        const activeApplications = (myApplications || []).filter(app => !['WITHDRAWN', 'REJECTED'].includes(app.status));
        const usedPriorities = new Set(activeApplications
            .map(app => Number(app.priority))
            .filter(priority => priority >= 1 && priority <= 3));
        const availablePriorities = [1, 2, 3].filter(priority => !usedPriorities.has(priority));
        const alreadyApplied = activeApplications.some(app => app.jobId === job.id);
        const approvedCount = Number(job.approvedCount || 0);
        const quota = Number(job.quota || 0);
        const quotaFull = quota > 0 && approvedCount >= quota;
        const applyBlockedReason = (() => {
            if (expired) return 'Recruitment expired';
            if (quotaFull) return 'Position quota is full';
            if (alreadyApplied) return 'You already have an active application for this position';
            if (availablePriorities.length === 0) return 'All 3 priorities are already used';
            return '';
        })();
        const canApply = !applyBlockedReason;
        const checkSvg = '<svg class="req-check" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9.00002 16.2L4.80002 12L3.40002 13.4L9.00002 19L21 7.00002L19.6 5.60002L9.00002 16.2Z" fill="#16A34A"/></svg>';
        const reqHtml = (job.requirements && job.requirements.length)
            ? job.requirements.map(r => `<div class="p-4 bg-gray-50 rounded-xl"><div class="req-item">${checkSvg}<p class="req-text font-semibold text-gray-800">${esc(r)}</p></div></div>`).join('')
            : '<p class="text-gray-400 text-sm">No specific requirements listed.</p>';

        const typeLabel = window.__ta_formatJobType ? window.__ta_formatJobType(job.type) : (job.type || '');
        const tv = String(job.type || '').trim() === 'COURSE' ? 'COURSE_TA' : (String(job.type || '').trim() === 'ACTIVITY' ? 'CLASS_TEST_TA' : String(job.type || '').trim());

        function parseCourseScheduleGrid(str) {
            if (!str) return [];
            try {
                const parsed = JSON.parse(str);
                return Array.isArray(parsed) ? parsed : [];
            } catch (_) {
                return [];
            }
        }

        function periodStart(p) {
            const map = { 1:'08:00',2:'08:50',3:'09:50',4:'10:40',5:'11:30',6:'13:00',7:'13:50',8:'14:45',9:'15:40',10:'16:35',11:'17:25',12:'18:30',13:'19:20',14:'20:10' };
            return map[Number(p)] || '';
        }

        function periodEnd(p) {
            const map = { 1:'08:45',2:'09:35',3:'10:35',4:'11:25',5:'12:15',6:'13:45',7:'14:35',8:'15:30',9:'16:25',10:'17:20',11:'18:10',12:'19:15',13:'20:05',14:'20:55' };
            return map[Number(p)] || '';
        }

        function mergeConsecutive(periods) {
            const ps = (periods || [])
                .map(x => Number(x))
                .filter(x => Number.isFinite(x))
                .sort((a,b) => a-b);
            const ranges = [];
            let start = null;
            let prev = null;
            ps.forEach(p => {
                if (start == null) { start = p; prev = p; return; }
                if (p === prev + 1) { prev = p; return; }
                ranges.push([start, prev]);
                start = p;
                prev = p;
            });
            if (start != null) ranges.push([start, prev]);
            return ranges;
        }

        function computeSchedule(job) {
            if (tv === 'FINAL_EXAM_TA') {
                const dur = Number(job.examDuration) || 0;
                const blocks = dur > 0 ? [{ week: '', day: '', time: String(job.examDateTime || '').replace('T', ' '), hours: dur, meta: 'Final Exam' }] : [];
                return { totalHours: dur, blocks };
            }

            const entries = parseCourseScheduleGrid(job.courseScheduleGrid);
            const dayKeys = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
            const dayLabel = { Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday' };
            const blocks = [];
            let totalPeriods = 0;
            entries.forEach(e => {
                const week = e && e.week != null ? String(e.week) : '';
                const sel = e && e.selection && typeof e.selection === 'object' ? e.selection : {};
                dayKeys.forEach(dk => {
                    const periods = Array.isArray(sel[dk]) ? sel[dk] : [];
                    totalPeriods += periods.length;
                    mergeConsecutive(periods).forEach(([s,e]) => {
                        const st = periodStart(s);
                        const et = periodEnd(e);
                        if (!st || !et) return;
                        const periodCount = (e - s + 1);
                        blocks.push({ week, day: dayLabel[dk] || dk, time: `${st}-${et}`, hours: periodCount * 0.75, meta: '' });
                    });
                });
            });
            return { totalHours: totalPeriods * 0.75, blocks };
        }

        const sch = computeSchedule(job);
        const scheduleHtml = sch.blocks.length ? `
            <div class="overflow-auto">
                <table class="w-full">
                    <thead>
                        <tr class="text-left text-[10px] text-gray-400 uppercase tracking-widest">
                            <th class="pb-3 pr-3">Week / Type</th>
                            <th class="pb-3 pr-3">Day</th>
                            <th class="pb-3 pr-3">Time</th>
                            <th class="pb-3">Duration</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${sch.blocks.map(b => `
                            <tr class="border-b border-gray-50">
                                <td class="py-3 pr-3 text-sm text-gray-700 font-semibold whitespace-nowrap">${esc(b.week ? ('Week ' + b.week) : (b.meta || ''))}</td>
                                <td class="py-3 pr-3 text-sm text-gray-600">${esc(b.day || '')}</td>
                                <td class="py-3 pr-3 text-sm text-gray-600">${esc(b.time || '')}</td>
                                <td class="py-3 text-sm text-gray-900 font-bold whitespace-nowrap">${Number(b.hours || 0).toFixed(2)} h</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
            <div class="mt-4 pt-4 border-t border-gray-100 text-sm text-gray-800 font-bold">Total Working Hours: ${Number(sch.totalHours || 0).toFixed(2)} hours</div>
        ` : `<p class="text-gray-400 pl-4 text-sm">No schedule was provided.</p>`;
        const typeSpecificHtml = (() => {
            if (tv === 'COURSE_TA') {
                const ws = job.courseWeekStart || '';
                const we = job.courseWeekEnd || '';
                return `
                    <section>
                        <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-3">
                            <span class="w-1.5 h-6 bg-blue-600 rounded-full"></span> Course TA Details
                        </h3>
                        <div class="pl-4 space-y-2 text-gray-600">
                            ${(ws && we) ? `<p><span class="font-bold">Weeks:</span> ${esc(String(ws))} - ${esc(String(we))}</p>` : ''}
                            ${job.courseScheduleGrid ? `<p class="text-sm text-gray-500">Timetable grid was provided by MO.</p>` : ''}
                        </div>
                    </section>
                `;
            }
            if (tv === 'LAB_TA') {
                return `
                    <section>
                        <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-3">
                            <span class="w-1.5 h-6 bg-blue-600 rounded-full"></span> Lab TA Details
                        </h3>
                        <div class="pl-4 space-y-2 text-gray-600">
                            ${job.courseScheduleGrid ? `<p class="text-sm text-gray-500">Schedule entries were provided by MO.</p>` : ''}
                        </div>
                    </section>
                `;
            }
            if (tv === 'FINAL_EXAM_TA') {
                return `
                    <section>
                        <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-3">
                            <span class="w-1.5 h-6 bg-blue-600 rounded-full"></span> Final Exam TA Details
                        </h3>
                        <div class="pl-4 space-y-2 text-gray-600">
                            ${job.examDateTime ? `<p><span class="font-bold">Date &amp; Time:</span> ${esc(String(job.examDateTime))}</p>` : ''}
                            ${job.examLocation ? `<p><span class="font-bold">Location:</span> ${esc(String(job.examLocation))}</p>` : ''}
                        </div>
                    </section>
                `;
            }
            if (tv === 'CLASS_TEST_TA') {
                return `
                    <section>
                        <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-3">
                            <span class="w-1.5 h-6 bg-blue-600 rounded-full"></span> Class Test TA Details
                        </h3>
                        <div class="pl-4 space-y-2 text-gray-600">
                            ${job.courseScheduleGrid ? `<p class="text-sm text-gray-500">Schedule entries were provided by MO.</p>` : ''}
                        </div>
                    </section>
                `;
            }
            return '';
        })();

        currentJob = job;
        document.getElementById('jobContent').innerHTML = `
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-8 border-b border-gray-100 bg-gradient-to-r from-blue-50 to-white">
                <div class="flex justify-between items-start mb-6">
                    <div class="flex gap-2">
                        ${typeLabel ? `<span class="bg-blue-600 text-white text-[10px] px-2 py-1 rounded font-bold uppercase">${esc(typeLabel)}</span>` : ''}
                        <span class="bg-green-100 text-green-600 text-[10px] px-2 py-1 rounded font-bold uppercase">${esc(job.status || 'Open')}</span>
                    </div>
                    <span class="text-blue-600 font-black text-2xl">TA Position</span>
                </div>
                <h1 class="text-3xl font-bold text-gray-900 mb-2">${esc(job.title || '')}</h1>
                ${job.courseName ? `<p class="text-gray-500 mb-6">${esc(job.courseName)}</p>` : ''}
                <div class="grid grid-cols-3 gap-6 text-sm text-gray-600">
                    <div class="flex items-center gap-3">
                        <div class="bg-white p-2 rounded-lg shadow-sm">
                            <span class="iconify text-blue-500 text-lg" data-icon="mdi:account-tie-outline"></span>
                        </div>
                        <div>
                            <p class="text-[10px] text-gray-400 font-bold uppercase">Instructor</p>
                            <p class="font-bold">${esc(job.posterName || 'N/A')}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="bg-white p-2 rounded-lg shadow-sm">
                            <span class="iconify text-blue-500 text-lg" data-icon="mdi:account-group-outline"></span>
                        </div>
                        <div>
                            <p class="text-[10px] text-gray-400 font-bold uppercase">Approved / Quota</p>
                            <p class="font-bold">${approvedCount} / ${quota || 'N/A'}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="bg-white p-2 rounded-lg shadow-sm">
                            <span class="iconify text-blue-500 text-lg" data-icon="mdi:calendar-clock"></span>
                        </div>
                        <div>
                            <p class="text-[10px] text-gray-400 font-bold uppercase">Deadline</p>
                            <p class="font-bold">${esc(deadline)}</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="p-8 space-y-10">
                ${job.description ? `<section>
                    <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-3">
                        <span class="w-1.5 h-6 bg-blue-600 rounded-full"></span> Course overview
                    </h3>
                    <p class="text-gray-600 leading-relaxed pl-4 border-l-2 border-gray-50">${esc(job.description)}</p>
                </section>` : ''}

                <section>
                    <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-3">
                        <span class="w-1.5 h-6 bg-blue-600 rounded-full"></span> Schedule
                    </h3>
                    <div class="pl-4">${scheduleHtml}</div>
                </section>

                ${typeSpecificHtml}

                <section>
                    <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-3">
                        <span class="w-1.5 h-6 bg-blue-600 rounded-full"></span> Requirements
                    </h3>
                    <div class="grid grid-cols-2 gap-4 pl-4">${reqHtml}</div>
                </section>

                <div class="bg-amber-50 p-5 rounded-2xl border border-amber-100 flex gap-4">
                    <div class="bg-white p-2 h-fit rounded-lg shadow-sm">
                        <span class="iconify text-amber-500 text-xl" data-icon="mdi:alert-decagram-outline"></span>
                    </div>
                    <div>
                        <h4 class="text-sm font-bold text-amber-900 mb-1">Notice</h4>
                        <p class="text-xs text-amber-700 leading-relaxed">
                            Please ensure TA working hours do not conflict with your academic schedule. Do not provide false information; violations may result in disqualification.
                        </p>
                    </div>
                </div>

                <div class="pt-6 border-t border-gray-100 flex gap-4">
                    ${canApply
                        ? `<a class="flex-1 bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition-all shadow-lg shadow-blue-100 text-center" href="ta-recruitment-application-form.html?jobId=${job.id}">Apply now</a>`
                        : `<button type="button" class="flex-1 bg-gray-200 text-gray-600 font-bold py-4 rounded-xl cursor-not-allowed" onclick="showToast('${safeJsStr(applyBlockedReason)}', 'warning')">Apply now</button>`}
                    <button class="px-8 py-4 border border-gray-200 text-gray-600 font-bold rounded-xl hover:bg-gray-50 transition-all" onclick="history.back()">
                        Back
                    </button>
                </div>
            </div>
        </div>`;
    } catch (err) {
        document.getElementById('jobContent').innerHTML = '<div class="text-center text-red-500 py-16">Failed to load position details.</div>';
        showToast(err.message || 'Failed to load job details', 'error');
    }
})();
</script>
</body>
</html>
