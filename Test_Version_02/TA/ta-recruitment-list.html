<main class="flex-1 ml-64 p-8">
<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
<div>
<h1 class="text-2xl font-bold text-gray-900">TA Recruitment</h1>
<p class="text-gray-500 mt-1" id="pageSubtitle">Find TA opportunities that fit you</p>
</div>
<div class="flex items-center gap-3">
<div class="relative">
<input class="w-64 pl-10 pr-4 py-2 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Search position / instructor..." type="text" id="searchInput"/>
<span class="iconify absolute left-3 top-2.5 text-gray-400" data-icon="material-symbols:search"></span>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="list-container">
<div class="col-span-full text-center text-gray-400 py-16">Loading positions...</div>
</div>
</main>
</div>
<script src="/js/api.js"></script>
<script>
let allJobs = [];

function parseDeadline(deadline) {
    if (!deadline) return null;
    const raw = String(deadline).trim();
    if (!raw) return null;
    const normalized = raw.replace(/\//g, '-');
    const pureDateMatch = normalized.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (pureDateMatch) {
        const [, year, month, day] = pureDateMatch;
        return new Date(Number(year), Number(month) - 1, Number(day), 23, 59, 59, 999).getTime();
    }
    let ts = Date.parse(raw);
    if (!Number.isNaN(ts)) return ts;
    ts = Date.parse(normalized);
    return Number.isNaN(ts) ? null : ts;
}

function getDeadlineStatus(deadline) {
    const deadlineTs = parseDeadline(deadline);
    if (!deadlineTs) {
        return { text: 'Open', className: 'bg-green-100 text-green-600' };
    }
    const now = Date.now();
    const diff = deadlineTs - now;
    const reminderWindowMs = 48 * 60 * 60 * 1000;
    if (diff <= 0) {
        return { text: 'Expired', className: 'bg-gray-200 text-gray-600' };
    }
    if (diff <= reminderWindowMs) {
        return { text: 'Closing soon', className: 'bg-orange-100 text-orange-600' };
    }
    return { text: 'Open', className: 'bg-green-100 text-green-600' };
}

function renderJobs(jobs) {
    const container = document.getElementById('list-container');
    if (jobs.length === 0) {
        container.innerHTML = '<div class="col-span-full text-center text-gray-400 py-16"><span class="iconify text-6xl text-gray-200 mx-auto mb-4" data-icon="material-symbols:work-outline"></span><p>No open positions found</p></div>';
        return;
    }

    container.innerHTML = jobs.map(job => {
        const deadline = job.deadline ? formatDate(job.deadline) : 'N/A';
        const deadlineStatus = getDeadlineStatus(job.deadline);

        return `<div class="bg-white rounded-xl border border-gray-100 shadow-sm card-hover flex flex-col">
            <div class="p-6 flex-1">
                <div class="flex justify-between items-start mb-4">
                    <span class="${deadlineStatus.className} text-xs px-2.5 py-1 rounded-full font-medium">${deadlineStatus.text}</span>
                    ${job.applicationCount != null ? `<span class="text-xs text-gray-400">${job.applicationCount} applied</span>` : ''}
                </div>
                <h3 class="font-bold text-gray-900 text-lg mb-2 line-clamp-1">${esc(job.title || job.courseName || '')}</h3>
                <div class="space-y-2 text-sm text-gray-500 mb-6">
                    <div class="flex items-center gap-2">
                        <span class="iconify text-gray-400" data-icon="material-symbols:person-outline"></span>
                        <span>Instructor: ${esc(job.posterName || 'N/A')}</span>
                    </div>
                    ${job.courseName ? `<div class="flex items-center gap-2">
                        <span class="iconify text-gray-400" data-icon="material-symbols:book-outline"></span>
                        <span>Course: ${esc(job.courseName)}</span>
                    </div>` : ''}
                    <div class="flex items-center gap-2">
                        <span class="iconify text-gray-400" data-icon="material-symbols:calendar-month-outline"></span>
                        <span>Deadline: ${esc(deadline)}</span>
                    </div>
                    ${job.quota ? `<div class="flex items-center gap-2">
                        <span class="iconify text-gray-400" data-icon="material-symbols:group-outline"></span>
                        <span>Quota: ${job.quota}</span>
                    </div>` : ''}
                </div>
            </div>
            <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex items-center justify-between rounded-b-xl">
                <span class="text-xs text-gray-400">TA Position</span>
                <a class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition-all shadow-sm" href="ta-recruitment-detail.html?id=${job.id}">View details</a>
            </div>
        </div>`;
    }).join('');
}

document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    if (!q) { renderJobs(allJobs); return; }
    const filtered = allJobs.filter(j =>
        (j.title || '').toLowerCase().includes(q) ||
        (j.courseName || '').toLowerCase().includes(q) ||
        (j.posterName || '').toLowerCase().includes(q)
    );
    renderJobs(filtered);
});

(async function init() {
    const user = requireAuth(['TA']);
    if (!user) return;
    updateSidebarUser(user);

    try {
        allJobs = await API.get('/api/jobs');
        document.getElementById('pageSubtitle').textContent = `${allJobs.length} position(s) available`;
        renderJobs(allJobs);
    } catch (err) {
        document.getElementById('list-container').innerHTML = '<div class="col-span-full text-center text-red-500 py-16">Failed to load positions</div>';
        showToast(err.message || 'Failed to load jobs', 'error');
    }
})();
</script>
