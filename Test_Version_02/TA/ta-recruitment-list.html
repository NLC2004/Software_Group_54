<script src="/js/api.js"></script>
<script>
let allJobs = [];

function formatJobType(t) {
    const raw = String(t || '').trim();
    const tv = raw === 'COURSE' ? 'COURSE_TA' : (raw === 'ACTIVITY' ? 'CLASS_TEST_TA' : raw);
    const map = {
        COURSE_TA: 'Course TA',
        LAB_TA: 'Lab TA',
        FINAL_EXAM_TA: 'Final Exam TA',
        CLASS_TEST_TA: 'Class Test TA'
    };
    return map[tv] || tv || '';
}

function parseDeadline(deadline) {
    if (!deadline) return null;
    const raw = String(deadline).trim();
    if (!raw) return null;
    const normalized = raw.replace(/\//g, '-');
    const pureDateMatch = normalized.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (pureDateMatch) {
        const [, year, month, day] = pureDateMatch;
        return new Date(Number(year), Number(month) - 1, Number(day), 23, 59, 59, 999).getTime();
    }
    let ts = Date.parse(raw);
    if (!Number.isNaN(ts)) return ts;
    ts = Date.parse(normalized);
    return Number.isNaN(ts) ? null : ts;
}

function getDeadlineStatus(deadline) {
    const deadlineTs = parseDeadline(deadline);
    if (!deadlineTs) {
        return { text: 'Open', className: 'bg-green-100 text-green-600' };
    }
    const now = Date.now();
    const diff = deadlineTs - now;
    const reminderWindowMs = 48 * 60 * 60 * 1000;
    if (diff <= 0) {
        return { text: 'Expired', className: 'bg-gray-200 text-gray-600' };
    }
    if (diff <= reminderWindowMs) {
        return { text: 'Closing soon', className: 'bg-orange-100 text-orange-600' };
    }
    return { text: 'Open', className: 'bg-green-100 text-green-600' };
}

function normalizeType(t) {
    const raw = String(t || '').trim();
    return raw === 'COURSE' ? 'COURSE_TA' : (raw === 'ACTIVITY' ? 'CLASS_TEST_TA' : raw);
}

function parseCourseScheduleGrid(str) {
    if (!str) return [];
    try {
        const parsed = JSON.parse(str);
        return Array.isArray(parsed) ? parsed : [];
    } catch (_) {
        return [];
    }
}

function periodStart(p) {
    const map = { 1:'08:00',2:'08:50',3:'09:50',4:'10:40',5:'11:30',6:'13:00',7:'13:50',8:'14:45',9:'15:40',10:'16:35',11:'17:25',12:'18:30',13:'19:20',14:'20:10' };
    return map[Number(p)] || '';
}

function periodEnd(p) {
    const map = { 1:'08:45',2:'09:35',3:'10:35',4:'11:25',5:'12:15',6:'13:45',7:'14:35',8:'15:30',9:'16:25',10:'17:20',11:'18:10',12:'19:15',13:'20:05',14:'20:55' };
    return map[Number(p)] || '';
}

function mergeConsecutive(periods) {
    const ps = (periods || [])
        .map(x => Number(x))
        .filter(x => Number.isFinite(x))
        .sort((a,b) => a-b);
    const ranges = [];
    let start = null;
    let prev = null;
    ps.forEach(p => {
        if (start == null) { start = p; prev = p; return; }
        if (p === prev + 1) { prev = p; return; }
        ranges.push([start, prev]);
        start = p;
        prev = p;
    });
    if (start != null) ranges.push([start, prev]);
    return ranges;
}

function computeScheduleBlocks(job) {
    const tv = normalizeType(job.type);
    if (tv === 'FINAL_EXAM_TA') {
        const dur = Number(job.examDuration) || 0;
        return {
            totalHours: dur,
            segmentCount: dur > 0 ? 1 : 0,
            blocks: dur > 0 ? [{ week: '', day: '', date: job.examDateTime || '', time: job.examDateTime || '', hours: dur, meta: 'Final Exam' }] : []
        };
    }

    const entries = parseCourseScheduleGrid(job.courseScheduleGrid);
    const dayKeys = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const dayLabel = { Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday' };
    const blocks = [];
    let totalPeriods = 0;
    entries.forEach(e => {
        const week = e && e.week != null ? String(e.week) : '';
        const sel = e && e.selection && typeof e.selection === 'object' ? e.selection : {};
        dayKeys.forEach(dk => {
            const periods = Array.isArray(sel[dk]) ? sel[dk] : [];
            totalPeriods += periods.length;
            mergeConsecutive(periods).forEach(([s,e]) => {
                const st = periodStart(s);
                const et = periodEnd(e);
                if (!st || !et) return;
                const periodCount = (e - s + 1);
                blocks.push({ week, day: dayLabel[dk] || dk, date: '', time: `${st}-${et}`, hours: periodCount * 0.75, meta: '' });
            });
        });
    });
    const totalHours = totalPeriods * 0.75;
    return { totalHours, segmentCount: blocks.length, blocks };
}

function openScheduleModal(jobId) {
    const job = (allJobs || []).find(j => String(j.id) === String(jobId));
    if (!job) return;
    const stats = computeScheduleBlocks(job);
    document.getElementById('scheduleModalTitle').textContent = 'Schedule Details';
    document.getElementById('scheduleModalTotal').textContent = `Total Working Hours: ${Number(stats.totalHours || 0).toFixed(2)} hours`;

    const body = document.getElementById('scheduleModalBody');
    if (!stats.blocks.length) {
        body.innerHTML = '<div class="text-gray-400 text-sm">No schedule was provided.</div>';
    } else {
        const rows = stats.blocks.map(b => `
            <tr class="border-b border-gray-50">
                <td class="py-3 pr-3 text-sm text-gray-700 font-semibold whitespace-nowrap">${esc(b.week ? ('Week ' + b.week) : (b.meta || ''))}</td>
                <td class="py-3 pr-3 text-sm text-gray-600">${esc(b.day || '')}</td>
                <td class="py-3 pr-3 text-sm text-gray-600">${esc(b.time || b.date || '')}</td>
                <td class="py-3 text-sm text-gray-900 font-bold whitespace-nowrap">${Number(b.hours || 0).toFixed(2)} h</td>
            </tr>
        `).join('');
        body.innerHTML = `
            <div class="overflow-auto">
                <table class="w-full">
                    <thead>
                        <tr class="text-left text-[10px] text-gray-400 uppercase tracking-widest">
                            <th class="pb-3 pr-3">Week / Type</th>
                            <th class="pb-3 pr-3">Day</th>
                            <th class="pb-3 pr-3">Time</th>
                            <th class="pb-3">Duration</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>
        `;
    }
    document.getElementById('schedule-modal').classList.add('active');
    document.getElementById('schedule-modal').setAttribute('aria-hidden', 'false');
}

function closeScheduleModal() {
    document.getElementById('schedule-modal').classList.remove('active');
    document.getElementById('schedule-modal').setAttribute('aria-hidden', 'true');
}

function renderJobs(jobs) {
    const container = document.getElementById('list-container');
    if (jobs.length === 0) {
        container.innerHTML = '<div class="col-span-full text-center text-gray-400 py-16"><span class="iconify text-6xl text-gray-200 mx-auto mb-4" data-icon="material-symbols:work-outline"></span><p>No open positions found</p></div>';
        return;
    }

    container.innerHTML = jobs.map(job => {
        const deadline = job.deadline ? formatDate(job.deadline) : 'N/A';
        const deadlineStatus = getDeadlineStatus(job.deadline);
        const stats = computeScheduleBlocks(job);
        const totalHours = Number(stats.totalHours || 0);
        const seg = Number(stats.segmentCount || 0);
        const summary = `Total ${totalHours.toFixed(2)}h · ${seg} segments`;

        return `<div class="bg-white rounded-xl border border-gray-100 shadow-sm card-hover flex flex-col">
            <div class="p-6 flex-1">
                <div class="flex justify-between items-start mb-4">
                    <span class="${deadlineStatus.className} text-xs px-2.5 py-1 rounded-full font-medium">${deadlineStatus.text}</span>
                    ${job.applicationCount != null ? `<span class="text-xs text-gray-400">${job.applicationCount} applied</span>` : ''}
                </div>
                <h3 class="font-bold text-gray-900 text-lg mb-2 line-clamp-1">${esc(job.title || job.courseName || '')}</h3>
                <div class="mb-4">
                    <span class="schedule-chip"><span>Total <b>${totalHours.toFixed(2)}</b>h</span><span class="text-gray-500">·</span><span><b>${seg}</b> segments</span></span>
                </div>
                <div class="space-y-2 text-sm text-gray-500 mb-6">
                    <div class="flex items-center gap-2">
                        <span class="iconify text-gray-400" data-icon="material-symbols:person-outline"></span>
                        <span>Instructor: ${esc(job.posterName || 'N/A')}</span>
                    </div>
                    ${job.courseName ? `<div class="flex items-center gap-2">
                        <span class="iconify text-gray-400" data-icon="material-symbols:book-outline"></span>
                        <span>Course: ${esc(job.courseName)}</span>
                    </div>` : ''}
                    <div class="flex items-center gap-2">
                        <span class="iconify text-gray-400" data-icon="material-symbols:calendar-month-outline"></span>
                        <span>Deadline: ${esc(deadline)}</span>
                    </div>
                    ${job.quota ? `<div class="flex items-center gap-2">
                        <span class="iconify text-gray-400" data-icon="material-symbols:group-outline"></span>
                        <span>Quota: ${job.quota}</span>
                    </div>` : ''}
                </div>
            </div>
            <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex items-center justify-between rounded-b-xl">
                <button class="text-xs text-blue-600 font-bold hover:underline" onclick="openScheduleModal('${safeJsStr(job.id)}')">View Schedule Details</button>
                <a class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition-all shadow-sm" href="ta-recruitment-detail.html?id=${job.id}">View details</a>
            </div>
        </div>`;
    }).join('');
}

document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    if (!q) { renderJobs(allJobs); return; }
    const filtered = allJobs.filter(j =>
        (j.title || '').toLowerCase().includes(q) ||
        (j.courseName || '').toLowerCase().includes(q) ||
        (j.posterName || '').toLowerCase().includes(q)
    );
    renderJobs(filtered);
});

(async function init() {
    const user = requireAuth(['TA']);
    if (!user) return;
    updateSidebarUser(user);

    try {
        allJobs = await API.get('/api/jobs');
        document.getElementById('pageSubtitle').textContent = `${allJobs.length} position(s) available`;
        renderJobs(allJobs);
    } catch (err) {
        document.getElementById('list-container').innerHTML = '<div class="col-span-full text-center text-red-500 py-16">Failed to load positions</div>';
        showToast(err.message || 'Failed to load jobs', 'error');
    }
})();
</script>
