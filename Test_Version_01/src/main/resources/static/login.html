<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUPT TA Recruitment</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                    <rect width="48" height="48" rx="12" fill="#4361EE"/>
                    <path d="M24 12L34 18V20H14V18L24 12Z" fill="white"/>
                    <rect x="17" y="22" width="4" height="10" rx="1" fill="white" opacity="0.85"/>
                    <rect x="23" y="22" width="4" height="10" rx="1" fill="white" opacity="0.85"/>
                    <rect x="29" y="22" width="4" height="10" rx="1" fill="white" opacity="0.85"/>
                    <rect x="14" y="33" width="22" height="3" rx="1" fill="white"/>
                </svg>
            </div>
            <h1>BUPT TA Recruitment</h1>
            <p>Teaching Assistant Recruitment System</p>
        </div>

        <div class="login-tabs">
            <button class="login-tab active" data-tab="login">Sign In</button>
            <button class="login-tab" data-tab="register">Register</button>
        </div>

        <div id="loginError" class="alert alert-error" style="display:none"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="l_user">Username</label>
                <input type="text" id="l_user" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="l_pass">Password</label>
                <input type="password" id="l_pass" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            <button type="button" id="forgotPwdBtn" class="btn btn-outline btn-block" style="margin-top:10px">Forgot Password</button>
        </form>

        <form id="registerForm" style="display:none">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>Student ID / ID</label>
                <input type="text" name="studentId" placeholder="Your student ID / identity number">
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="fullName" placeholder="Your full name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="your.email@bupt.edu.cn">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" placeholder="Phone number">
            </div>
            <div class="form-group">
                <label>Gender</label>
                <select name="gender" class="form-select">
                    <option value="">-- Select --</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Choose a password" required minlength="4">
            </div>
            <div class="form-group">
                <label>Role</label>
                <select name="role" class="form-select">
                    <option value="TA">Teaching Assistant (TA)</option>
                    <option value="MO">Module Organiser (MO)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>
    </div>

<script>
function roleHomePage(role) {
    if (role === 'MO') return '/mo.html';
    if (role === 'ADMIN') return '/admin.html';
    return '/ta.html';
}

const savedUser = JSON.parse(localStorage.getItem('user') || 'null');
if (localStorage.getItem('token') && savedUser && savedUser.role) {
    window.location.href = roleHomePage(savedUser.role);
}

const tabs = document.querySelectorAll('.login-tab');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');
const errorEl = document.getElementById('loginError');

function showErr(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
    setTimeout(() => errorEl.style.display = 'none', 4000);
}

tabs.forEach(tab => tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    loginForm.style.display = tab.dataset.tab === 'login' ? 'block' : 'none';
    registerForm.style.display = tab.dataset.tab === 'register' ? 'block' : 'none';
    errorEl.style.display = 'none';
}));

loginForm.addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(loginForm);
    try {
        const r = await fetch('/api/auth/login', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({username: fd.get('username'), password: fd.get('password')})
        });
        const d = await r.json();
        if (!r.ok) { showErr(d.error); return; }
        localStorage.setItem('token', d.token);
        localStorage.setItem('user', JSON.stringify(d.user));
        window.location.href = roleHomePage(d.user.role);
    } catch(e) { showErr('Connection failed. Is the server running?'); }
});

registerForm.addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(registerForm);
    try {
        const r = await fetch('/api/auth/register', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                username: fd.get('username'), password: fd.get('password'),
                studentId: fd.get('studentId'), fullName: fd.get('fullName'), email: fd.get('email'),
                phone: fd.get('phone'), gender: fd.get('gender'), role: fd.get('role')
            })
        });
        const d = await r.json();
        if (!r.ok) { showErr(d.error); return; }
        localStorage.setItem('token', d.token);
        localStorage.setItem('user', JSON.stringify(d.user));
        window.location.href = roleHomePage(d.user.role);
    } catch(e) { showErr('Connection failed. Is the server running?'); }
});

document.getElementById('forgotPwdBtn').addEventListener('click', async () => {
    const username = prompt('Enter your username for reset request:');
    if (!username) return;
    const fullName = prompt('Enter your full name for verification (optional):') || '';
    const email = prompt('Enter your email for verification (optional):') || '';
    const phone = prompt('Enter your phone for verification (optional):') || '';
    const reason = prompt('Reason:') || 'Forgot password';

    try {
        const r = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ username, fullName, email, phone, reason })
        });
        const d = await r.json();
        if (!r.ok) { showErr(d.error || 'Submit failed'); return; }
        alert('Reset request submitted.\nAdmin Phone: ' + d.adminContact.phone + '\nAdmin Email: ' + d.adminContact.email + '\nAfter approval password will be reset to 123456.');
    } catch (e) {
        showErr('Connection failed. Is the server running?');
    }
});
</script>
</body>
</html>
